 {id:'salton', group:'Cerca de casa', name:'El mar de Salton', blurb:'El lago accidental de California',
  keywords:['salton','mar','lago','colorado','rio','imperial','ave','migrator','sal','salinidad'],
  sections:[
   {h:'Un lago accidental', p:'El mar de Salton es el lago más grande de California y se formó por accidente. En 1905, las aguas de una inundación del río Colorado rompieron un canal de riego que debía llevar agua al Valle Imperial. Durante unos 2 años, el río se vació en una cuenca seca del desierto antes de que los trabajadores cerraran la abertura.'},
   {h:'Una parada para las aves', p:'El mar de Salton está en la Ruta Migratoria del Pacífico, un camino que siguen las aves entre el Ártico y Sudamérica. Se han visto allí más de 400 tipos de aves, y muchas se detienen a descansar y alimentarse. Los humedales han desaparecido en toda California, así que lugares como el mar de Salton importan aún más para las aves migratorias.'},
   {h:'Un mar que se encoge y se pone salado', p:'El mar no tiene salida, así que el agua solo se va por evaporación, y eso deja la sal atrás. El agua sobrante de las granjas del Valle Imperial ha ayudado a mantener lleno el mar, pero con los años ha entrado menos agua y el mar se ha ido encogiendo. Ahora es más salado que el océano, y el fondo del lago expuesto puede soplar polvo al aire. Se trabaja en proyectos para ayudar al mar y a su fauna.'}
  ],
  points:[
   {label:'cómo se formó el mar de Salton', facts:['El río Colorado se desbordó por un canal en 1905.','El agua llenó una cuenca seca durante unos 2 años.','Se convirtió en el lago más grande de California.']},
   {label:'por qué el mar importa a las aves', facts:['El mar está en la Ruta Migratoria del Pacífico.','Se han visto allí más de 400 tipos de aves.','Otros humedales de California han desaparecido.']},
   {label:'por qué el mar se encoge y se pone más salado', facts:['El agua solo se va por evaporación y la sal se queda.','Ahora entra menos agua sobrante de las granjas que antes.','Es más salado que el océano, y el polvo del fondo seco preocupa.']}
  ],
  thesis:'El mar de Salton es un lugar importante y con problemas por cómo se formó, por las aves que sostiene y por los problemas de un lago salado que se encoge.'},
 {id:'animaldef', group:'Animales y naturaleza', name:'Las defensas de los animales', blurb:'Cómo se protegen los animales de los depredadores',
  keywords:['animal','defensa','depredador','camuflaje','armadura','espina','pua'],
  sections:[
   {h:'Armaduras y espinas', p:'Algunos animales llevan su protección en el cuerpo. Las tortugas tienen caparazones duros, los armadillos tienen placas óseas y algunos armadillos pueden hacerse una bola. Un erizo se enrolla de modo que solo se ven sus espinas. Un puercoespín no puede lanzar sus púas, pero sus púas con garfios se sueltan con facilidad cuando un depredador las toca.'},
   {h:'Trucos de color', p:'Muchos animales evitan los ataques confundiéndose con el entorno. Una liebre ártica tiene pelo blanco que combina con la nieve, y una sepia puede cambiar el color y el patrón de su piel. Otros animales hacen lo contrario y usan colores brillantes como advertencia. Los colores llamativos de una rana dardo venenosa avisan a los depredadores de que su piel es tóxica.'},
   {h:'Olores y engaños', p:'Un zorrillo lanza un líquido de olor horrible que puede durar días, y un escarabajo bombardero lanza un chorro químico caliente. Una zarigüeya de Virginia puede quedarse floja y parecer muerta, lo que se llama hacerse la muerta. Los depredadores que quieren comida fresca suelen perder el interés y seguir su camino.'}
  ],
  points:[
   {label:'cómo protegen las armaduras y las espinas a los animales', facts:['Las tortugas tienen caparazones duros y los armadillos tienen placas óseas.','Un erizo se enrolla y solo se ven sus espinas.','Las púas del puercoespín se sueltan con facilidad, pero no se pueden lanzar.']},
   {label:'cómo ayuda el color a los animales a esconderse o advertir', facts:['El pelo blanco de la liebre ártica combina con la nieve.','Una sepia puede cambiar su color y su patrón.','Los colores brillantes de una rana dardo venenosa advierten de toxinas.']},
   {label:'cómo los olores y los trucos alejan a los depredadores', facts:['Un zorrillo lanza un líquido de olor horrible.','Un escarabajo bombardero lanza un chorro químico caliente.','Una zarigüeya se hace la muerta para que los depredadores pierdan el interés.']}
  ],
  thesis:'Los animales se protegen de los depredadores de muchas maneras, como armaduras y espinas, trucos de color, y olores o comportamientos ingeniosos.'},
 {id:'hurricane', group:'La Tierra, el espacio y la salud', name:'Los huracanes', blurb:'Cómo se forman las tormentas gigantes y por qué la gente se prepara',
  keywords:['huracan','tormenta','oceano','viento','ojo','marejada','tropical'],
  sections:[
   {h:'Cómo se forma un huracán', p:'Un huracán es una tormenta gigante que gira y se forma sobre agua tibia del océano. El agua debe estar al menos a unos 80 grados Fahrenheit, porque el agua tibia le da energía a la tormenta. Cuando el aire cálido y húmedo sube, forma tormentas eléctricas, y entra más aire por debajo para ocupar su lugar. La rotación de la Tierra ayuda a que todo el sistema gire. Cuando sus vientos llegan a 74 millas por hora, la tormenta se llama huracán.'},
   {h:'Partes de la tormenta', p:'El centro de un huracán se llama ojo, y allí el aire está en calma y a veces el cielo está despejado. Alrededor del ojo está la pared del ojo, un anillo de tormentas con los vientos más fuertes y la lluvia más intensa. Bandas de lluvia en espiral se extienden por cientos de millas. Los científicos clasifican los huracanes de la categoría 1 a la categoría 5 según la velocidad de sus vientos.'},
   {h:'Cómo mantenerse a salvo', p:'La temporada de huracanes del Atlántico va del 1 de junio al 30 de noviembre. El viento es peligroso, pero la marejada ciclónica, un aumento del nivel del mar que empuja el agua hacia la tierra, suele ser la parte más mortal de un huracán. Como la escala del 1 al 5 solo mide el viento, incluso un huracán de categoría baja puede causar inundaciones mortales. Los meteorólogos siguen las tormentas para que la gente pueda prepararse o evacuar.'}
  ],
  points:[
   {label:'cómo se forma un huracán', facts:['Los huracanes se forman sobre agua del océano de al menos unos 80 grados Fahrenheit.','El aire cálido y húmedo sube y forma tormentas eléctricas.','Una tormenta se convierte en huracán cuando sus vientos llegan a 74 millas por hora.']},
   {label:'las partes de un huracán', facts:['El ojo en el centro está en calma.','La pared del ojo tiene los vientos más fuertes y la lluvia más intensa.','Los huracanes se clasifican de la categoría 1 a la categoría 5 según la velocidad del viento.']},
   {label:'cómo se mantiene la gente a salvo', facts:['La temporada de huracanes del Atlántico va del 1 de junio al 30 de noviembre.','La marejada ciclónica suele ser la parte más mortal de un huracán.','Los meteorólogos siguen las tormentas para que la gente pueda prepararse o evacuar.']}
  ],
  thesis:'Los huracanes son tormentas poderosas por cómo se forman sobre agua tibia, por cómo se organizan alrededor de un ojo y una pared del ojo, y por qué la gente debe prepararse para ellos.'},
 {id:'coral', group:'Animales y naturaleza', name:'Los arrecifes de coral', blurb:'Los bosques tropicales del mar',
  keywords:['coral','arrecife','oceano','alga','blanqueamiento','polipo','mar'],
  sections:[
   {h:'Animales que construyen casas de piedra', p:'Los corales pueden parecer rocas o plantas, pero son animales. Un coral está formado por diminutos animales de cuerpo blando llamados pólipos, y cada pólipo construye un esqueleto duro a su alrededor. Con los años, estos esqueletos se acumulan y forman un arrecife de coral. Unas algas diminutas llamadas zooxantelas viven dentro de los corales, producen alimento con la luz del sol y les dan sus colores brillantes.'},
   {h:'Una ciudad bajo el mar', p:'Los arrecifes de coral cubren menos del 1 por ciento del fondo del océano, pero cerca del 25 por ciento de todas las especies del océano viven en ellos o a su alrededor. Peces, cangrejos, tortugas marinas y muchos otros animales encuentran allí comida y refugio, por eso a los arrecifes se les llama los bosques tropicales del mar. El arrecife de coral más grande del mundo es la Gran Barrera de Coral de Australia, que mide más de 1,000 millas de largo. Los arrecifes también protegen las costas porque debilitan las olas durante las tormentas.'},
   {h:'Problemas por el agua caliente', p:'Cuando el océano se calienta demasiado, los corales se estresan y expulsan las algas que viven dentro de ellos. Sin las algas, el coral se vuelve blanco, lo que se llama blanqueamiento, y pierde su principal fuente de alimento. Un coral blanqueado puede recuperarse si el agua se enfría, pero largos periodos de calor pueden matarlo. La contaminación que llega al mar también puede dañar los arrecifes.'}
  ],
  points:[
   {label:'cómo los corales construyen los arrecifes', facts:['Los corales son animales formados por diminutos pólipos.','Cada pólipo construye un esqueleto duro a su alrededor.','Las algas dentro de los corales producen alimento y les dan color.']},
   {label:'por qué son importantes los arrecifes', facts:['Los arrecifes cubren menos del 1 por ciento del fondo del océano.','Cerca del 25 por ciento de las especies del océano viven en ellos o a su alrededor.','Los arrecifes protegen las costas al debilitar las olas durante las tormentas.']},
   {label:'qué daña a los arrecifes de coral', facts:['El agua caliente hace que los corales expulsen sus algas.','Sin algas, los corales se vuelven blancos en lo que se llama blanqueamiento.','La contaminación que llega al mar también puede dañar los arrecifes.']}
  ],
  thesis:'Los arrecifes de coral son estructuras vivas importantes por cómo los construyen los corales, la enorme cantidad de animales que albergan y los peligros que enfrentan por el calentamiento del agua.'},
 {id:'aqueduct', group:'El mundo antiguo', name:'Los acueductos romanos', blurb:'Llevar agua a una ciudad con la gravedad',
  keywords:['acueducto','romano','roma','agua','arco','pont','gravedad'],
  sections:[
   {h:'Agua para una ciudad en crecimiento', p:'La antigua Roma creció tanto que los pozos y manantiales cercanos no podían dar suficiente agua. En el año 312 a. C., los romanos construyeron su primer acueducto, el Aqua Appia, que llevaba agua unas 10 millas hasta la ciudad. Durante los siglos siguientes, Roma construyó 11 acueductos, y la ciudad llegó a tener cerca de 1 millón de habitantes. El agua llenaba fuentes y baños públicos y abastecía algunas casas.'},
   {h:'Cómo trabajaba la gravedad', p:'Los acueductos no tenían bombas. Los ingenieros aprovechaban la gravedad construyendo el canal con una pendiente suave hacia abajo desde el manantial hasta la ciudad. Si la pendiente era demasiado inclinada, el agua podía dañar el canal, y si era demasiado plana, el agua casi no avanzaba. La mayor parte del canal iba bajo tierra, y los puentes de arcos se construían solo donde el agua tenía que cruzar un valle.'},
   {h:'Hechos para durar', p:'El Pont du Gard, un puente-acueducto en Francia, se construyó alrededor del año 19 a. C. Tiene tres niveles de arcos y mide casi 160 pies de altura. Los romanos hicieron los acueductos con piedra, ladrillo y un concreto resistente. Algunas partes todavía se usan hoy, y el Aqua Virgo todavía lleva agua a la Fontana de Trevi en Roma.'}
  ],
  points:[
   {label:'por qué Roma necesitaba acueductos', facts:['Roma creció demasiado para los pozos y manantiales cercanos.','El primer acueducto, construido en el año 312 a. C., llevaba agua unas 10 millas.','Con el tiempo, Roma construyó 11 acueductos para cerca de 1 millón de personas.']},
   {label:'cómo funcionaban los acueductos', facts:['La gravedad movía el agua, sin bombas.','Los ingenieros hacían una pendiente suave hacia abajo del manantial a la ciudad.','Los puentes de arcos se usaban solo para cruzar valles.']},
   {label:'por qué los acueductos duraron', facts:['El Pont du Gard se construyó alrededor del año 19 a. C. y mide casi 160 pies de altura.','Los romanos usaron piedra, ladrillo y concreto resistente.','El Aqua Virgo todavía lleva agua a la Fontana de Trevi.']}
  ],
  thesis:'Los acueductos romanos fueron importantes porque una ciudad en crecimiento necesitaba agua, los ingenieros usaron la gravedad para llevarla y su diseño resistente ha durado unos dos mil años.'},
 {id:'kush', group:'El mundo antiguo', name:'El Reino de Kush', blurb:'Gobernantes del Nilo que conquistaron Egipto',
  keywords:['kush','nubia','nilo','egipto','meroe','piramide','piye','napata','sudan'],
  sections:[
   {h:'Un reino sobre el Nilo', p:'El Reino de Kush fue un antiguo reino africano en una región llamada Nubia, a lo largo del río Nilo, en lo que hoy es el norte de Sudán. Kush comerciaba oro, ébano y marfil con sus vecinos. Durante cientos de años se gobernó desde la ciudad de Napata y más tarde desde Meroe. El reino duró muchos siglos.'},
   {h:'Los faraones negros', p:'Hacia el año 730 a. C., un rey de Kush llamado Piye marchó al norte y conquistó Egipto. Se convirtió en el primer gobernante de la vigesimoquinta dinastía de Egipto, cuyos reyes suelen llamarse los faraones negros. Los reyes de Kush gobernaron Egipto durante muchas décadas, restauraron templos antiguos e incluso construyeron pirámides. Su gobierno terminó cuando los asirios invadieron Egipto.'},
   {h:'Hierro y pirámides en Meroe', p:'Después de que los asirios los expulsaran de Egipto, los kushitas gobernaron desde más al sur. Meroe se convirtió en la capital, y los historiadores creen que los bosques de la región, que daban combustible para los hornos de hierro, ayudaron a convertirla en un centro de trabajo del hierro. Los kushitas también construyeron en Meroe muchas pirámides empinadas y estrechas, más pequeñas que las de Egipto. Hoy las pirámides de Meroe son Patrimonio de la Humanidad de la UNESCO.'}
  ],
  points:[
   {label:'qué fue el Reino de Kush', facts:['Kush fue un antiguo reino africano en Nubia, a lo largo del Nilo.','Estaba en lo que hoy es el norte de Sudán.','Kush comerciaba oro, ébano y marfil.']},
   {label:'cómo Kush conquistó Egipto', facts:['El rey Piye conquistó Egipto hacia el año 730 a. C.','Los reyes de la vigesimoquinta dinastía de Egipto se llaman los faraones negros.','Restauraron templos antiguos y construyeron pirámides.']},
   {label:'por qué se conoce a Meroe', facts:['Meroe se convirtió en la capital de Kush.','Los bosques cercanos ayudaron a que Meroe fuera un centro de trabajo del hierro.','Las pirámides de Meroe son Patrimonio de la Humanidad de la UNESCO.']}
  ],
  thesis:'El Reino de Kush fue una civilización africana poderosa por su lugar a lo largo del Nilo, su conquista de Egipto y sus logros en Meroe.'},
 {id:'solar', group:'La Tierra, el espacio y la salud', name:'La energía solar', blurb:'Convertir la luz del sol en electricidad',
  keywords:['solar','luz','panel','paneles','electricidad','energia','celda','inversor'],
  sections:[
   {h:'La luz del sol se convierte en electricidad', p:'Un panel solar está formado por muchas celdas fotovoltaicas, generalmente de silicio. Cuando la luz del sol llega a una celda, suelta unas partículas diminutas llamadas electrones, y un campo eléctrico dentro de la celda las empuja en una sola dirección. Este flujo constante es una corriente eléctrica. Los paneles no tienen partes que se muevan y usan la luz del sol, no su calor.'},
   {h:'Cómo llega la energía a una casa', p:'Los paneles solares producen electricidad de corriente continua, o CC, pero las casas usan corriente alterna, o CA. Un aparato llamado inversor convierte la CC en CA. Una casa puede usar la electricidad de inmediato, enviar el exceso a la red eléctrica o guardarlo en una batería para después. Los paneles producen menos electricidad en días nublados y ninguna de noche.'},
   {h:'Por qué la gente usa energía solar', p:'La luz del sol es una fuente de energía renovable, lo que significa que no se acabará. Los paneles solares no queman combustible, así que producen electricidad sin contaminar el aire mientras funcionan. La energía solar también puede alimentar lugares lejos de las líneas eléctricas. Un reto es que el sol no brilla todo el tiempo, por eso se necesitan baterías o la red cuando está oscuro.'}
  ],
  points:[
   {label:'cómo los paneles solares producen electricidad', facts:['Los paneles solares tienen celdas fotovoltaicas, generalmente de silicio.','La luz del sol suelta electrones y crea una corriente eléctrica.','Los paneles usan la luz del sol, no su calor.']},
   {label:'cómo llega la electricidad a una casa', facts:['Los paneles producen electricidad CC, pero las casas usan CA.','Un inversor convierte la CC en CA.','El exceso puede ir a la red o a una batería.']},
   {label:'por qué la gente elige la energía solar', facts:['La luz del sol es una fuente renovable que no se acabará.','Los paneles solares producen electricidad sin quemar combustible.','El sol no brilla de noche, así que se necesitan baterías o la red.']}
  ],
  thesis:'La energía solar convierte la luz del sol en electricidad mediante celdas fotovoltaicas, la lleva a las casas con un inversor y les da a las personas una opción de energía renovable.'}

}

/* ---------- Whole-essay feedback (rule-based; observations and questions only) ---------- */
function analyze(text,topic){
  var paras=(text||'').split(/\n\s*\n/).map(function(p){return p.replace(/\s+/g,' ').trim();}).filter(Boolean);
  var n=paras.length,total=wc(text);if(!total)return null;
  var src=topic&&topic.sections?passageText(topic):null;
  var ctx={topicName:topic?topic.name:L('your topic','tu tema'),keywords:topic?keywordsOf(topic):[],source:src};
  var out={overview:[],paras:[],global:[]};
  out.overview.push(info(L('The essay has '+total+' words in '+n+' paragraph'+(n===1?'':'s')+'.','El ensayo tiene '+total+' palabras en '+n+(n===1?' párrafo':' párrafos')+'.')));
  if(n===1&&total>120)out.overview.push(chk(false,'',L('Everything is in one block. Press Enter twice between paragraphs so each one shows up separately.','Todo está en un solo bloque. Presiona Enter dos veces entre párrafos para que cada uno aparezca por separado.')));
  else if(n!==5)out.overview.push(chk(false,'',L('The plan we practice has 5 paragraphs: an introduction, three supporting points, and a conclusion. Yours has '+n+'. Is that what you meant?','El plan que se practica tiene 5 párrafos: una introducción, tres puntos de apoyo y una conclusión. El tuyo tiene '+n+'. ¿Es eso lo que querías?')));
  else out.overview.push(chk(true,L('Five paragraphs: introduction, three supporting points, and a conclusion.','Cinco párrafos: introducción, tres puntos de apoyo y una conclusión.'),''));
  var thesisSent='';
  paras.forEach(function(p,i){
    var ss=sentences(p),items=[],role,kind;
    if(i===0&&n>1){role=L('Introduction','Introducción');kind='intro';}
    else if(i===n-1&&n>=3){role=L('Conclusion','Conclusión');kind='concl';}
    else {role=n===1?L('Essay','Ensayo'):L('Supporting paragraph','Párrafo de apoyo');kind='body';}
    if(kind==='intro'){
      items.push(chk(ss.length>=3&&ss.length<=5,L(ss.length+' sentences: about right for a hook, background, and thesis.',ss.length+' oraciones: más o menos lo adecuado para un gancho, un contexto y una tesis.'),L('Your introduction has '+ss.length+' sentence'+(ss.length===1?'':'s')+'. The plan is a hook, 1 or 2 background sentences, and a thesis. Which of those does yours have?','Tu introducción tiene '+ss.length+(ss.length===1?' oración':' oraciones')+'. El plan es un gancho, 1 o 2 oraciones de contexto y una tesis. ¿Cuáles de esas partes tiene la tuya?')));
      var hk=ss[0];items.push(chk(wc(hk)>=6&&wc(hk)<=30&&!announce(hk),L('Your first sentence works as a hook.','Tu primera oración funciona como gancho.'),L('Look at your first sentence. Does it make a reader curious, or does it announce the topic?','Mira tu primera oración. ¿Despierta la curiosidad del lector o solo anuncia el tema?')));
      var th=ss[ss.length-1];thesisSent=th;
      items.push(chk(ss.length>1&&signal(th)&&(!ctx.keywords.length||related(th,ctx)),L('Your last sentence reads like a thesis.','Tu última oración parece una tesis.'),L('Is your last sentence your thesis? It should say what your essay will help the reader understand.','¿Tu última oración es tu tesis? Debe decir lo que tu ensayo ayudará a entender al lector.')));
      if(firstPerson(th))items.push(chk(false,'',L('Your thesis uses a first-person word. Can you state the idea directly?','Tu tesis usa una palabra en primera persona. ¿Puedes expresar la idea directamente?')));
    } else if(kind==='body'){
      items.push(chk(ss.length>=3&&ss.length<=6,L(ss.length+' sentences: a good size.',ss.length+' oraciones: un buen tamaño.'),L('This paragraph has '+ss.length+' sentence'+(ss.length===1?'':'s')+'. The plan is about 3 to 5: topic sentence, support, an optional quote, and a concluding sentence.','Este párrafo tiene '+ss.length+(ss.length===1?' oración':' oraciones')+'. El plan es de unas 3 a 5: oración temática, apoyo, una cita opcional y una oración de cierre.')));
      if(thesisSent)items.push(chk(overlap(ss[0],thesisSent)>=1||related(ss[0],ctx),L('Your first sentence connects to your thesis.','Tu primera oración se conecta con tu tesis.'),L('How does your first sentence connect to your thesis?','¿Cómo se conecta tu primera oración con tu tesis?')));
      var hasNum=/\d/.test(p),hasQ=/["“”«»]/.test(p),srcOv=src?overlap(p,src)>=4:false;
      items.push(chk(hasNum||hasQ||srcOv,L('It includes evidence.','Incluye evidencia.'),L('Where is the evidence? Add a fact, detail, or quote from your source.','¿Dónde está la evidencia? Agrega un dato, detalle o cita de tu fuente.')));
      if(hasQ)quoteChecks(p,src).forEach(function(x){items.push(x);});
      if(src){var cs=copyScore(stripQuotes(p),src);items.push(chk(cs<0.4,L('Your wording looks like your own.','Tu redacción parece tuya.'),L('Parts of this paragraph are very close to the source. Which parts could you say in your own words?','Partes de este párrafo se parecen mucho a la fuente. ¿Cuáles podrías decir con tus propias palabras?')));}
      var last=ss[ss.length-1],nextFirst=paras[i+1]?sentences(paras[i+1])[0]:'';
      items.push(chk(transitions(last)||(nextFirst&&overlap(last,nextFirst)>=1),L('Your last sentence leads toward the next paragraph.','Tu última oración lleva hacia el siguiente párrafo.'),L('How does your last sentence lead into the next paragraph?','¿Cómo lleva tu última oración al siguiente párrafo?')));
    } else if(kind==='concl'){
      items.push(chk(ss.length>=2&&ss.length<=5,L(ss.length+' sentences: about right.',ss.length+' oraciones: más o menos lo adecuado.'),L('Your conclusion has '+ss.length+' sentence'+(ss.length===1?'':'s')+'. The plan is a closing topic sentence and a supporting sentence that continues the tie.','Tu conclusión tiene '+ss.length+(ss.length===1?' oración':' oraciones')+'. El plan es una oración temática de cierre y una oración de apoyo que continúa el enlace.')));
      if(thesisSent)items.push(chk(overlap(p,thesisSent)>=2,L('It connects back to your thesis.','Se conecta con tu tesis.'),L('Which words connect your conclusion to your thesis?','¿Qué palabras conectan tu conclusión con tu tesis?')));
      var before=paras.slice(0,i).join(' ');var newNums=(p.match(/\b\d[\d,.]*\b/g)||[]).filter(function(x){return before.indexOf(x)<0;});
      items.push(chk(!newNums.length,L('It doesn’t bring in new numbers.','No trae números nuevos.'),L('The number '+newNums.join(', ')+' did not appear earlier. A conclusion usually saves new facts for the body.','El número '+newNums.join(', ')+' no apareció antes. Una conclusión suele dejar los datos nuevos para el desarrollo.')));
    } else {items.push(info(L('Press Enter twice between paragraphs so the introduction, each supporting paragraph, and the conclusion can each be checked.','Presiona Enter dos veces entre párrafos para que se puedan revisar la introducción, cada párrafo de apoyo y la conclusión.')));}
    out.paras.push({role:role,kind:kind,excerpt:p.slice(0,90)+(p.length>90?'…':''),items:items});
  });
  var all=sentences(text),starts={};
  all.forEach(function(s){var w=(fold(s).match(/[\p{L}’']+/u)||[''])[0];if(w)starts[w]=(starts[w]||0)+1;});
  var rep=Object.keys(starts).filter(function(w){return starts[w]>=3;});
  out.global.push(chk(!rep.length,L('Your sentences start in different ways.','Tus oraciones empiezan de maneras distintas.'),L('Several sentences start with “'+rep[0]+'.” Could you start some of them differently?','Varias oraciones empiezan con «'+rep[0]+'». ¿Podrías empezar algunas de otra manera?')));
  var firstS=sentences(text)[0]||'';var afterFirst=text.indexOf(firstS)>=0?text.replace(firstS,' '):text;
  var f1=fold(text),f2=fold(afterFirst);
  var informal=(WL==='es'?(f1.match(/\b(creo que|pienso que|en mi opinion|me parece)\b/g)||[]).concat(f2.match(/\b(tu|tus|usted|ustedes)\b/g)||[]):(f1.match(/\b(i think|i believe|in my opinion)\b/g)||[]).concat(f2.match(/\b(you|your)\b/g)||[]));
  out.global.push(chk(!informal.length,L('The style is formal.','El estilo es formal.'),L('Informative writing sounds formal. Look for opinion phrases or words that speak straight to the reader, and try stating the ideas directly.','La escritura informativa suena formal. Busca frases de opinión o palabras que le hablen directamente al lector, y prueba a expresar las ideas de forma directa.')));
  if(WL!=='es'){
    var contr=(text.match(/\b\w+n['’]t\b|\b(?:it|that|there|they|we|he|she|i)['’](?:s|re|ve|ll|d|m)\b/ig)||[]);
    out.global.push(chk(!contr.length,L('No contractions to check.','No hay contracciones que revisar.'),L('Contractions such as “'+(contr[0]||'')+'” are usually avoided in formal writing. Could you write the full words?','Las contracciones como «'+(contr[0]||'')+'» se suelen evitar en la escritura formal. ¿Podrías escribir las palabras completas?')));
  }
  var lower=0,noend=0,longS=0,loneI=0;
  all.forEach(function(s){var core=s.replace(/^[¿¡"“«'(\s]+/,'');if(/^\p{Ll}/u.test(core))lower++;if(wc(s)>35)longS++;if(WL!=='es'&&/(^|\s)i(\s|$)/.test(s))loneI++;});
  paras.forEach(function(p){if(!/[.!?]["”’')\]»]*$/.test(p))noend++;});
  var conv=[];
  if(lower)conv.push(L(lower+' sentence'+(lower===1?'':'s')+' start without a capital letter',lower+(lower===1?' oración empieza':' oraciones empiezan')+' sin letra mayúscula'));
  if(noend)conv.push(L(noend+' paragraph'+(noend===1?'':'s')+' end without . ! or ?',noend+(noend===1?' párrafo termina':' párrafos terminan')+' sin . ! o ?'));
  if(longS)conv.push(L(longS+' very long sentence'+(longS===1?'':'s')+' (over 35 words)',longS+(longS===1?' oración muy larga':' oraciones muy largas')+' (más de 35 palabras)'));
  if(loneI)conv.push(L('a lowercase one-letter pronoun needs a capital letter','un pronombre de una letra en minúscula necesita mayúscula'));
  out.global.push(chk(!conv.length,L('The simple checks found no capitalization, ending punctuation, or very long sentence problems. They can still miss things, so proofread out loud.','Las revisiones simples no encontraron problemas de mayúsculas, puntuación final ni oraciones muy largas. Aun así pueden pasar cosas por alto, así que revisa leyendo en voz alta.'),L('Look at conventions: '+conv.join('; ')+'.','Revisa las convenciones: '+conv.join('; ')+'.')));
  if(src){
    var nums=Array.from(new Set(text.match(/\b\d[\d,.]*\b/g)||[])).map(function(x){return x.replace(/[.,]+$/,'');});
    var missing=nums.filter(function(x){return src.indexOf(x)<0;});
    if(nums.length)out.global.push(chk(!missing.length,L('Every number matches the source.','Todos los números coinciden con la fuente.'),L('These numbers are not in the source: '+missing.join(', ')+'. Check each one.','Estos números no están en la fuente: '+missing.join(', ')+'. Revisa cada uno.')));
    else out.global.push(info(L('No numbers were found to check against the source.','No se encontraron números para comparar con la fuente.')));
  } else out.global.push(info(L('Facts can’t be checked for this topic because no source text is available. Check each fact against your source, and ask your teacher about anything you’re unsure of.','No se pueden revisar los datos de este tema porque no hay texto de la fuente. Compara cada dato con tu fuente y pregunta a tu maestro o maestra sobre lo que no estés seguro.')));
  return out;
}
function reportHtml(rep){
  if(!rep)return '<p class="note">'+L('Paste your essay above, then press “Get feedback.”','Pega tu ensayo arriba y luego presiona «Obtener comentarios».')+'</p>';
  var h='<div class="report" id="rep-box"><h2>'+L('Feedback','Comentarios')+'</h2><p class="note" data-say="ui">'+L('These are questions and observations. Every change is your choice, and your teacher reads the rest.','Estas son preguntas y observaciones. Cada cambio es decisión tuya, y tu maestro o maestra lee el resto.')+'</p>'+listenBtn('rep-box',L('Listen to feedback','Escuchar los comentarios'));
  h+=resultsList(rep.overview);
  rep.paras.forEach(function(p,i){h+='<div class="pcard '+p.kind+'"><h3>'+L('Paragraph ','Párrafo ')+(i+1)+': '+esc(p.role)+'</h3><p class="excerpt">'+esc(p.excerpt)+'</p>'+resultsList(p.items)+'</div>';});
  h+='<div class="pcard"><h3>'+L('Whole essay','Todo el ensayo')+'</h3>'+resultsList(rep.global)+'</div></div>';

 hook:{

var TTS=(typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined');
function listenBtn(target,label){return TTS?'<button class="listen" data-action="listen" data-target="'+target+'">'+esc(label)+'</button>':'';}
function voiceFor(lang){
  var vs=[];try{vs=window.speechSynthesis.getVoices()||[];}catch(e){}
  var prefs=lang==='es'?['es-US','es-MX','es-419','es-ES','es']:['en-US','en-GB','en'];
  for(var i=0;i<prefs.length;i++){var p=prefs[i].toLowerCase();var v=vs.filter(function(x){return (x.lang||'').replace('_','-').toLowerCase().indexOf(p)===0;})[0];if(v)return v;}
  return null;
}
function collect(id){
  var root=document.getElementById(id);if(!root)return [];
  var els=[];if(root.hasAttribute('data-say'))els.push(root);
  Array.prototype.push.apply(els,root.querySelectorAll('[data-say]'));
  return els.map(function(el){
    var lang=el.getAttribute('data-say')==='wl'?WL:UL;
    var tx=(el.tagName==='TEXTAREA'||el.tagName==='INPUT')?el.value:el.textContent;
    tx=(tx||'').replace(/___+/g,lang==='es'?' espacio en blanco ':' blank ').replace(/\s+/g,' ').trim();
    return {t:tx,lang:lang};
  }).filter(function(p){return p.t;});
}
function speakParts(parts){
  if(!TTS||!parts.length)return;
  var ss=window.speechSynthesis;try{ss.cancel();}catch(e){}
  parts.forEach(function(p){
    var u=new window.SpeechSynthesisUtterance(p.t);
    u.lang=p.lang==='es'?'es-MX':'en-US';
    var v=voiceFor(p.lang);if(v){u.voice=v;u.lang=v.lang;}
    u.rate=+state.rate||1;
    ss.speak(u);
  });
}

function slotDone(k){var B=STORES.drill;var t=(B.store[k]||'').trim();return wc(t)>=4&&t.indexOf('___')<0;}

  var B=STORES.drill;if(!B)return;var prev=true,all=true;

    var part=keys[P.step],opts=pickOptions(t,part,P);
    h+='<h3 class="pick-h">'+(keys.length>1?L('Part '+(P.step+1)+' of '+keys.length+': ','Parte '+(P.step+1)+' de '+keys.length+': '):'')+L(PICKHEAD[part][0],PICKHEAD[part][1])+'</h3><p class="note" data-say="ui">'+L(CRIT[part][0],CRIT[part][1])+'</p>';
    h+='<div class="opts" id="pick-opts" role="radiogroup" aria-label="'+esc(L(PICKHEAD[part][0],PICKHEAD[part][1]))+'">';
    opts.forEach(function(o,i){
      var letter=String.fromCharCode(65+i);
      if(!P.checked)h+='<label class="opt'+(P.sel===i?' sel':'')+'"><input type="radio" name="pick" value="'+i+'"'+(P.sel===i?' checked':'')+'><span class="letter" data-say="ui">'+letter+'</span><span class="txt" data-say="wl">'+esc(o.text)+'</span></label>';
      else h+='<div class="opt done '+(o.best?'best':'weak')+(P.sel===i?' chosen':'')+'"><span class="letter" data-say="ui">'+letter+'</span><div><p class="txt" data-say="wl">'+esc(o.text)+'</p><p class="why" data-say="ui"><b>'+(o.best?L('Best choice. ','Mejor opción. '):L('Weaker. ','Más débil. '))+'</b>'+esc(why(part,o.tag))+'</p>'+(P.sel===i?'<span class="badge '+(o.best?'ok':'q')+'">'+L('Your pick','Tu elección')+'</span>':'')+'</div></div>';
    });
    h+='</div>';
    if(P.checked){
      var r=P.results[P.results.length-1];
      h+='<div class="banner" id="pick-msg"><b data-say="ui">'+(r.correct?L('You picked the best sentence!','¡Elegiste la mejor oración!'):L('Not this time. Read why each sentence is stronger or weaker.','Esta vez no. Lee por qué cada oración es más fuerte o más débil.'))+'</b></div>';
      var more=P.step+1<keys.length,nl=more?L('Next part','Siguiente parte'):(state.focus==='full'?L('See the intro','Ver la introducción'):L('Next round','Siguiente ronda'));
      h+='<div class="row">'+listenBtn('pick-opts',L('Listen to the options','Escuchar las opciones'))+'<button data-action="pick-next">'+nl+'</button></div>';
    } else {
      h+='<div class="row">'+listenBtn('pick-opts',L('Listen to the options','Escuchar las opciones'))+'<button id="pick-check" data-action="pick-check"'+(P.sel==null?' disabled':'')+'>'+L('Check the pick','Revisar la elección')+'</button></div>';
    }
  }
  return h+pickStatsHtml();
}
function nextRound(){PICK=null;if(state.topic==='random')state.cur=nextTopicId();save();render();window.scrollTo(0,0);}
function teacherPanel(){
  return '<details class="teach"><summary>'+L('For teachers','Para docentes')+'</summary>'+
   '<p>'+L('This program drills one formula: a hook, 1 or 2 background sentences, and a thesis. Students write the three parts, press “Check the intro,” read the questions, and move to the next rep with a new topic. A “clean rep” means every check looks good. The checks look at structure, such as length, connection to the topic, and whether the thesis tells what the essay will explain. They do not judge how interesting the writing is, so teachers still read the rest.','Este programa practica una sola fórmula: un gancho, 1 o 2 oraciones de contexto y una tesis. Los estudiantes escriben las tres partes, presionan «Revisar la introducción», leen las preguntas y pasan a la siguiente repetición con un tema nuevo. Una «repetición limpia» significa que todas las revisiones salieron bien. Las revisiones miran la estructura, como la longitud, la conexión con el tema y si la tesis dice lo que explicará el ensayo. No juzgan qué tan interesante es la escritura, así que los maestros siguen leyendo el resto.')+'</p>'+
   '<p>'+L('The “Pick the best sentence” activity gives students three ready-made sentences for the hook, the background, or the thesis. They choose the strongest, then read why each one is stronger or weaker. The weaker sentences show common problems, such as announcing the topic, being too general, or crowding in details that belong in the body paragraphs. In full mode students pick all three parts and see the intro they built, then can write their own version.','La actividad «Elegir la mejor oración» da a los estudiantes tres oraciones ya escritas para el gancho, el contexto o la tesis. Eligen la más fuerte y luego leen por qué cada una es más fuerte o más débil. Las oraciones más débiles muestran problemas comunes, como anunciar el tema, ser demasiado general o llenarse de detalles que van en los párrafos de desarrollo. En el modo completo los estudiantes eligen las tres partes y ven la introducción que armaron, y después pueden escribir su propia versión.')+'</p>'+
   '<p>'+L('Support levels: “Starter frames shown” gives the beginning of each sentence, “Questions only” gives a guiding question, and “No hints” shows only the part names. The tool suggests less support after three clean reps in a row. The “Get help” button is always available.','Niveles de apoyo: «Con marcos de inicio» muestra el comienzo de cada oración, «Solo preguntas» muestra una pregunta guía y «Sin pistas» muestra solo los nombres de las partes. La herramienta sugiere menos apoyo después de tres repeticiones limpias seguidas. El botón «Pedir ayuda» siempre está disponible.')+'</p>'+
   '<p>'+L('To start students in one activity, add <code>#write</code> or <code>#pick</code> to the end of this page’s link. For Spanish, add <code>-es</code> for a Spanish interface with English readings, or <code>-esw</code> for Spanish interface, readings, and writing (for example <code>#pick-es</code> or <code>#write-esw</code>). Students can also change the activity and both languages at the top of the page.','Para que los estudiantes empiecen en una actividad, agrega <code>#write</code> o <code>#pick</code> al final del enlace de esta página. Para español, agrega <code>-es</code> para una interfaz en español con lecturas en inglés, o <code>-esw</code> para interfaz, lecturas y escritura en español (por ejemplo <code>#pick-es</code> o <code>#write-esw</code>). Los estudiantes también pueden cambiar la actividad y los dos idiomas en la parte de arriba de la página.')+'</p>'+
   '<p>'+L('The 19 topics come from a built-in catalog of short readings and ready-made sentences written for this tool. Please read them before class use. Read-aloud uses the voices built into the browser or device, and the Spanish text was translated for this tool, so a bilingual colleague should review it.','Los 19 temas vienen de un catálogo integrado de lecturas cortas y oraciones ya escritas para esta herramienta. Conviene leerlas antes de usarlas en clase. La lectura en voz alta usa las voces integradas en el navegador o dispositivo, y el texto en español se tradujo para esta herramienta, por lo que conviene que una colega o un colega bilingüe lo revise.')+'</p>'+
   '<p>'+L('Student work and stats are saved only in the browser on that device. Nothing is sent anywhere.','El trabajo y las estadísticas de los estudiantes se guardan solo en el navegador de ese dispositivo. No se envía nada a ningún lado.')+'</p>'+
   '<div class="row"><button class="ghost" data-action="reset-all" data-confirm="1">'+L('Clear all saved work and stats on this device','Borrar todo el trabajo y las estadísticas guardados en este dispositivo')+'</button></div></details>';
}
function formulaStrip(){
  return '<div class="formula" aria-label="'+L('The formula','La fórmula')+'"><span class="pc p-n"><b>1</b> '+esc(SLOTS.hook.label())+'</span><span class="plus" aria-hidden="true">+</span><span class="pc p-n"><b>2</b> '+esc(SLOTS.background.label())+'</span><span class="plus" aria-hidden="true">+</span><span class="pc p-a"><b>3</b> '+esc(SLOTS.thesis.label())+'</span></div>';
}
function progressHtml(){
  var S=state.session,g=state.goal,pct=Math.min(100,Math.round(S.reps/g*100));
  var h='<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+g+'" aria-valuenow="'+Math.min(S.reps,g)+'"><i style="width:'+pct+'%"></i></div><p class="note">'+L(S.reps+' of '+g+' reps this session. '+S.clean+' clean.',S.reps+' de '+g+' repeticiones en esta sesión. '+S.clean+' limpias.')+'</p>';
  if(S.reps>=g)h+='<div class="banner"><b data-say="ui">'+L('Session goal reached! Start a new session to keep going.','¡Meta de la sesión alcanzada! Empieza una sesión nueva para seguir.')+'</b><div class="row"><button data-action="new-session">'+L('Start a new session','Empezar una sesión nueva')+'</button></div></div>';
  return h;
}
function tipsHtml(){
  var h='',st=state.stats;
  if(st.streak>=3&&state.support<3&&st.total-state.levelAt>=3)h+='<div class="banner"><b data-say="ui">'+L('Three clean reps in a row. Ready for less support?','Tres repeticiones limpias seguidas. ¿Listo para menos apoyo?')+'</b><div class="row"><button data-action="level-up">'+L('Try less support','Probar con menos apoyo')+'</button></div></div>';
  var worst=null,max=0;['hook','background','thesis'].forEach(function(k){if(st.miss[k]>max){max=st.miss[k];worst=k;}});
  if(worst&&state.focus==='full'&&st.total>=3)h+='<div class="banner"><span data-say="ui">'+L('Most “Think about it” points so far: '+slotName(worst)+'. Try practicing that part on its own.','Más puntos de «Piénsalo» hasta ahora: '+slotName(worst)+'. Prueba practicar esa parte sola.')+'</span><div class="row"><button class="ghost" data-action="focus-tip" data-slot="'+worst+'">'+L('Practice '+slotName(worst)+' only','Practicar solo: '+slotName(worst))+'</button></div></div>';
  return h;
}
function statsHtml(){
  var s=state.stats;
  return '<h2>'+L('Your progress','Tu progreso')+'</h2><div class="stats"><div><b>'+s.total+'</b><span>'+L('Reps','Repeticiones')+'</span></div><div><b>'+s.clean+'</b><span>'+L('Clean reps','Repeticiones limpias')+'</span></div><div><b>'+s.streak+'</b><span>'+L('Streak','Racha')+'</span></div><div><b>'+s.best+'</b><span>'+L('Best streak','Mejor racha')+'</span></div></div>';
}
function historyHtml(){
  if(!state.history.length)return '';
  var h='<h2>'+L('Recent intros','Introducciones recientes')+'</h2><p class="small">'+L('The last 20 reps are saved here. Copy any of them into a Google Doc.','Las últimas 20 repeticiones se guardan aquí. Copia cualquiera en un documento de Google.')+'</p>';
  state.history.forEach(function(it,i){
    var parts=['hook','background','thesis'].filter(function(k){return it[k];}).map(function(k){return pieceHtml(k,it[k]);}).join(' ');
    h+='<div class="saved"><b>'+esc(it.topicName)+'</b> <span class="badge '+(it.clean?'ok':'q')+'">'+(it.clean?L('Clean','Limpia'):L('Needs work','Por mejorar'))+'</span><p class="para">'+parts+'</p><div class="row"><button class="ghost" data-action="copyrep" data-i="'+i+'">'+L('Copy','Copiar')+'</button></div></div>';
  });
  return h+'<p class="msg" id="copy-msg" aria-live="polite"></p>';
}
function render(){
  STORES={};
  var t=currentTopic(),keys=repKeys(),ch=hookChallenge();
  var h='<h1>'+L('Intro Drills','Práctica rápida de introducciones')+'</h1><p class="sub">'+L('Practice the same three-part formula again and again: hook, background, thesis. Every rep is a new topic. You write every sentence, and the tool checks it.','Practica la misma fórmula de tres partes una y otra vez: gancho, contexto y tesis. Cada repetición tiene un tema nuevo. Tú escribes cada oración y la herramienta la revisa.')+'</p>';
  h+=toolbar()+formulaStrip()+colorLegend()+settings();
  if(state.mode==='pick'){h+=pickView()+teacherPanel();document.getElementById('app').innerHTML=h;return;}
  h+=progressHtml()+tipsHtml();
  var ctx=Object.assign(ctxBase(t),{challenge:ch});
  var rep=state.stats.total+1;
  h+='<h2>'+L('Rep '+rep+': '+t.name,'Repetición '+rep+': '+t.name)+'</h2>';
  if(state.topic==='random')h+='<div class="row" style="margin-top:0"><button class="ghost" data-action="new-topic">'+L('Different topic','Otro tema')+'</button></div>';
  if(keys.indexOf('hook')>=0&&ch.id!=='any')h+='<div class="note-box"><b>'+L('Hook style: '+cname(ch)+'.','Estilo de gancho: '+cname(ch)+'.')+'</b> '+esc(ctip(ch))+'</div>';
  if(t.sections){var id='src-'+t.id;h+='<details class="source" id="'+id+'" open><summary>'+L('Read the facts: ','Lee los datos: ')+esc(t.name)+'</summary>'+listenBtn(id,L('Listen to the source','Escuchar la fuente'))+t.sections.map(function(s){return '<h4 data-say="wl">'+esc(s.h)+'</h4><p data-say="wl">'+esc(s.p)+'</p>';}).join('')+'</details>';}
  h+=drillBuilder(keys,state.draft,ctx,t);
  h+=statsHtml()+historyHtml();
  h+=teacherPanel();
  document.getElementById('app').innerHTML=h;
  updateLocks();updatePreview();
}

/* ---------- Events ---------- */
var app=document.getElementById('app');
function armed(btn){if(btn.dataset.confirm&&btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.classList.add('armed');btn.setAttribute('data-orig',btn.textContent);btn.textContent=L('Click again to confirm','Haz clic otra vez para confirmar');setTimeout(function(){if(btn.isConnected){btn.dataset.armed='';btn.classList.remove('armed');btn.textContent=btn.getAttribute('data-orig')||btn.textContent;}},4000);return true;}return false;}
function copyText(text,done){
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done(ok);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done(true);},fb);}else fb();
}
function invalidate(){
  if(!LAST)return;LAST=null;
  Array.prototype.forEach.call(document.querySelectorAll('[id^="res-drill-"]'),function(e){e.innerHTML='';});
  var s=document.getElementById('rep-summary');if(s)s.innerHTML='';
}
function fresh(){state.draft={};LAST=null;HELP={};}
app.addEventListener('click',function(e){
  var btn=e.target.closest('button[data-action]');if(!btn||btn.disabled)return;
  var a=btn.dataset.action,k=btn.dataset.slot;
  if(btn.dataset.confirm&&armed(btn))return;
  if(a==='listen'){speakParts(collect(btn.dataset.target));return;}
  if(a==='stop'){try{window.speechSynthesis.cancel();}catch(x){}return;}
  if(a==='help'){HELP[k]=Math.min(3,(HELP[k]||0)+1);document.getElementById('help-drill-'+k).innerHTML=helpHtml(k,STORES.drill.ctx,HELP[k]);}
  else if(a==='useframe'){var B=STORES.drill;if(!(B.store[k]||'').trim()){B.store[k]=SLOTS[k].frame(B.ctx);var ta=document.getElementById('ta-drill-'+k);ta.value=B.store[k];save();invalidate();updateLocks();updatePreview();ta.focus();}}
  else if(a==='check-intro'){
    var B2=STORES.drill,q={},total=0;
    B2.keys.forEach(function(kk){var t=(B2.store[kk]||'').trim();var arr=runChecks(kk,t,B2.ctx);var bad=arr.filter(function(x){return x.ok===false;}).length;q[kk]=bad;total+=bad;document.getElementById('res-drill-'+kk).innerHTML=resultsList(arr)+listenBtn('res-drill-'+kk,L('Listen','Escuchar'));});
    LAST={q:q,total:total};
    document.getElementById('rep-summary').innerHTML='<div class="banner" id="rep-msg"><b data-say="ui">'+(total===0?L('Clean rep! Every check looks good.','¡Repetición limpia! Todas las revisiones salieron bien.'):L(total+(total===1?' thing to think about.':' things to think about.')+' Fix them and check again, or move on to the next rep.','Hay '+total+(total===1?' punto':' puntos')+' para pensar. Corrígelos y revisa otra vez, o pasa a la siguiente repetición.'))+'</b>'+listenBtn('rep-msg',L('Listen','Escuchar'))+'</div>';
    updateLocks();
  }
  else if(a==='next-rep'){
    if(!LAST)return;var t=currentTopic(),st=state.stats,keys=STORES.drill.keys,clean=LAST.total===0;
    var entry={topicId:t.id,topicName:t.name,clean:clean};keys.forEach(function(kk){entry[kk]=(state.draft[kk]||'').trim();});
    st.total++;if(clean){st.clean++;st.streak++;if(st.streak>st.best)st.best=st.streak;}else st.streak=0;
    keys.forEach(function(kk){st.miss[kk]=(st.miss[kk]||0)+(LAST.q[kk]||0);});
    state.session.reps++;if(clean)state.session.clean++;
    state.history.unshift(entry);state.history=state.history.slice(0,20);
    fresh();if(state.topic==='random')state.cur=nextTopicId();
    save();render();window.scrollTo(0,0);
  }
  else if(a==='new-topic'){fresh();state.cur=nextTopicId();save();render();}
  else if(a==='pick-check'){
    var t8=currentTopic(),P=pickRoundFor(t8),keys8=pickKeys(),part8=keys8[P.step],opts8=pickOptions(t8,part8,P);
    if(P.sel==null||P.checked)return;
    var o=opts8[P.sel];P.checked=true;P.results.push({part:part8,text:o.text,correct:o.best});
    var ps=state.pickStats;ps.total++;if(o.best){ps.correct++;ps.streak++;if(ps.streak>ps.best)ps.best=ps.streak;}else ps.streak=0;
    save();render();
  }
  else if(a==='pick-next'){
    var P2=PICK,keys9=pickKeys();if(!P2)return;
    P2.step++;P2.sel=null;P2.checked=false;
    if(P2.step>=keys9.length&&state.focus!=='full'){nextRound();}else{render();}
  }
  else if(a==='pick-round'){nextRound();}
  else if(a==='pick-new-topic'){PICK=null;state.cur=nextTopicId();save();render();}
  else if(a==='pick-write'){var t9=currentTopic();state.mode='write';state.topic=t9.id;fresh();PICK=null;save();render();window.scrollTo(0,0);}
  else if(a==='new-session'){state.session={reps:0,clean:0};save();render();}
  else if(a==='level-up'){state.support=Math.min(3,state.support+1);state.levelAt=state.stats.total;save();render();}
  else if(a==='focus-tip'){state.focus=k;invalidate();save();render();}
  else if(a==='copyrep'){var it=state.history[+btn.dataset.i];var txt=['hook','background','thesis'].map(function(kk){return it[kk];}).filter(Boolean).join(' ');copyText(txt,function(ok){var m=document.getElementById('copy-msg');if(m)m.textContent=ok?L('Copied. Paste it into Google Docs.','Copiado. Pégalo en Google Docs.'):L('Copy didn’t work here. Select the text and copy it yourself.','No se pudo copiar aquí. Selecciona el texto y cópialo tú mismo.');});}
  else if(a==='reset-all'){var u=state.ui,w=state.wl;state=blank();state.ui=u;state.wl=w;LAST=null;HELP={};try{localStorage.removeItem(KEY);}catch(x){}render();window.scrollTo(0,0);}
});
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.matches&&el.matches('textarea[data-bid]')){var B=STORES.drill;if(!B)return;B.store[el.dataset.slot]=el.value;save();invalidate();updateLocks();updatePreview();}
});
app.addEventListener('change',function(e){
  var el=e.target,id=el.id;
  if(id==='ui-lang'){state.ui=el.value==='es'?'es':'en';applyLang();save();render();}
  else if(id==='w-lang'){state.wl=el.value==='es'?'es':'en';applyLang();fresh();state.cur=null;state.deck=[];save();render();}
  else if(id==='rate'){state.rate=+el.value||1;save();}
  else if(id==='set-mode'){state.mode=el.value==='pick'?'pick':'write';PICK=null;invalidate();save();render();}
  else if(id==='set-topic'){state.topic=el.value;fresh();PICK=null;state.cur=el.value==='random'?nextTopicId():null;save();render();}
  else if(el.name==='pick'){var Pp=PICK;if(Pp&&!Pp.checked){Pp.sel=+el.value;var cb=document.getElementById('pick-check');if(cb)cb.disabled=false;Array.prototype.forEach.call(document.querySelectorAll('label.opt'),function(l){l.classList.toggle('sel',l.contains(el));});}}
  else if(id==='set-focus'){state.focus=el.value;invalidate();save();render();}
  else if(id==='set-support'){state.support=+el.value||2;state.levelAt=state.stats.total;save();render();}
  else if(id==='set-style'){state.hookStyle=el.value;invalidate();save();render();}
  else if(id==='set-goal'){state.goal=+el.value||10;save();render();}
});
window.addEventListener('hashchange',function(){readHash();save();render();});
render();
})();

</script>
