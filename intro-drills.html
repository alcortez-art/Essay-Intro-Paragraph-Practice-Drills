<!doctype html>
<html lang="en">
<head>

<style>
:root{
  --paper:#f4f6fa; --surface:#ffffff; --ink:#17233b; --muted:#56627a; --line:#d5dbe6;
  --blue:#2f6fdc; --blue-t:#dde8fb; --green:#238a5c; --green-t:#dcf1e6; --orange:#d9731a; --orange-t:#fbe6d2; --yellow:#c99a00; --yellow-t:#fdf0b8; --gray:#6b7488; --gray-t:#e7eaf0; --pt1:#7a4fd0; --pt2:#1c8a8a; --pt3:#c2447f;
  --accent-ink:#ffffff; --on-pc:#ffffff; --ok:#1d7a4f; --q:#955700; --warn-bg:#fff3d9; --lock:#c3cad8; --focus:#2f6fdc;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

  :root:not([data-theme="light"]){
    --paper:#111722; --surface:#1a2231; --ink:#e9edf5; --muted:#a6b0c3; --line:#34405a;
    --blue:#7ea9f2; --blue-t:#1f3358; --green:#6cc79b; --green-t:#1b3a2d; --orange:#f0a35e; --orange-t:#4a2f16; --yellow:#e3b93b; --yellow-t:#4a3c0a; --gray:#9aa4b8; --gray-t:#2a3243; --pt1:#b79cf2; --pt2:#5fd0d0; --pt3:#f08ab8;
    --accent-ink:#111722; --on-pc:#111722; --ok:#7bd6a6; --q:#f2c26b; --warn-bg:#3a2e12; --lock:#44506a; --focus:#7ea9f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111722; --surface:#1a2231; --ink:#e9edf5; --muted:#a6b0c3; --line:#34405a;
  --blue:#7ea9f2; --blue-t:#1f3358; --green:#6cc79b; --green-t:#1b3a2d; --orange:#f0a35e; --orange-t:#4a2f16; --yellow:#e3b93b; --yellow-t:#4a3c0a; --gray:#9aa4b8; --gray-t:#2a3243; --pt1:#b79cf2; --pt2:#5fd0d0; --pt3:#f08ab8;
  --accent-ink:#111722; --on-pc:#111722; --ok:#7bd6a6; --q:#f2c26b; --warn-bg:#3a2e12; --lock:#44506a; --focus:#7ea9f2;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:1020px;margin:0 auto;padding:22px 18px 70px}
h1{font-size:2.1rem;line-height:1.1;margin:0 0 6px;letter-spacing:-.015em}
h2{font-size:1.35rem;margin:26px 0 8px;line-height:1.2}
h3{font-size:1.05rem;margin:0;line-height:1.25}
p{margin:0 0 10px}
.sub{color:var(--muted);margin:0;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:.9rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 0;font-size:.92rem}
.legend span.pc{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--accent-ink);padding:.5em 1em;font-weight:700}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover{border-color:var(--ink)}
button:disabled{opacity:.42;cursor:not-allowed}
button.armed{background:#b3261e;border-color:#b3261e;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
nav.modes{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
nav.modes button{background:transparent;color:var(--ink);border-color:var(--line)}
nav.modes button.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.assigned{margin:18px 0 4px;padding:10px 14px;border-left:10px solid var(--ink);background:var(--surface);border-radius:4px 14px 14px 4px}
.lead{max-width:66ch;color:var(--muted);margin-bottom:14px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:8px 0 6px}
.topic{display:block;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-left:10px solid var(--line);border-radius:4px 14px 14px 4px;padding:10px 12px;font-weight:400}
.topic b{display:block;font-size:1.02rem}
.topic span{display:block;font-size:.88rem;color:var(--muted)}
.topic.on{border-color:var(--ink);border-left-color:var(--ink)}
.own{margin:10px 0 4px}
.tgroup{margin:18px 0 2px;font-size:1rem;color:var(--muted)}
.own label,label.ask{display:block;font-weight:700;margin-bottom:6px}
input[type=text],select{width:100%;max-width:420px;padding:.55em .7em;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{width:100%;padding:.65em .8em;border:2px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus{border-color:var(--ink)}
textarea:disabled{opacity:.7}
.p-a{--pc:var(--blue);--pc-t:var(--blue-t)}
.p-y{--pc:var(--yellow);--pc-t:var(--yellow-t);--on-pc:#1d2433}
.p-g{--pc:var(--green);--pc-t:var(--green-t)}
.p-n{--pc:var(--gray);--pc-t:var(--gray-t)}
.slot{border-left:10px solid var(--pc);background:var(--surface);padding:14px 16px 16px;margin:14px 0;border-radius:4px 14px 14px 4px}
.slot.locked{border-left-color:var(--lock);opacity:.6}
.slot-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.chip{display:inline-block;background:var(--pc-t);padding:1px 11px;border-radius:999px;font-size:.85rem;font-weight:700}
.slot.done .chip{background:var(--pc);color:var(--on-pc)}
.pc{background:var(--pc-t);border-bottom:3px solid var(--pc);padding:1px 4px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.preview{margin:18px 0;padding:14px 16px;border:2px dashed var(--line);border-radius:14px;background:var(--surface)}
.preview .para{margin:8px 0 0;line-height:1.9}
ul.res{list-style:none;padding:0;margin:10px 0 0}
ul.res li{display:flex;gap:10px;padding:3px 0}
ul.res .mark{font-weight:700;width:1.3em;flex:none;text-align:center}
ul.res li.ok{color:var(--ok)}
ul.res li.q{color:var(--q)}
ul.res li.i{color:var(--muted)}
ul.res li span.t{color:var(--ink)}
.note{font-size:.95rem;color:var(--muted);margin:8px 0 0}
.help .rung{margin-top:10px;padding:10px 12px;background:var(--pc-t);border-radius:10px}
.help .rung p{margin:4px 0 0}
.help .model{font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media (max-width:800px){.two{grid-template-columns:1fr}}
details.source{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0}
details.source summary{cursor:pointer;font-weight:700}
details.source h4{margin:12px 0 2px}
details.source p{margin:0 0 6px}
.thesis-box{padding:10px 14px;border-left:10px solid var(--blue);background:var(--surface);border-radius:4px 14px 14px 4px;margin:10px 0}
.facts{margin:6px 0 0;padding-left:1.2em}
.points{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.points button{background:var(--surface);color:var(--ink);border:2px solid var(--line);font-weight:400;text-align:left}
.points button.on{border-color:var(--ink);border-left:10px solid var(--ink)}
.tick{color:var(--ok);font-weight:700}
.saved{background:var(--surface);border-left:10px solid var(--gray);border-radius:4px 14px 14px 4px;padding:12px 16px;margin:10px 0}
.saved .para{margin:6px 0;line-height:1.8}
.dots{display:flex;gap:6px;align-items:center;margin:4px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.steps button{background:var(--surface);color:var(--ink);border:2px solid var(--line);font-weight:400;padding:.3em .8em;font-size:.92rem}
.steps button.on{border-color:var(--ink);font-weight:700}
.steps button.fin{border-left:8px solid var(--ink)}
ul.cards{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
li.card{background:var(--surface);border-left:10px solid var(--lock);border-radius:4px 14px 14px 4px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
li.card.c1{border-left-color:var(--pt1)} li.card.c2{border-left-color:var(--pt2)} li.card.c3{border-left-color:var(--pt3)}
li.card .moves{display:flex;gap:6px;flex-wrap:wrap}
li.card .moves button{padding:.15em .6em;font-size:.85rem;background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media (max-width:800px){.cols{grid-template-columns:1fr}}
.col h3{margin-bottom:6px}
.essay{background:var(--surface);border-radius:14px;padding:16px 20px;margin:12px 0;max-width:72ch}
.essay p{margin:0 0 12px;text-indent:1.5em}
.report .pcard{background:var(--surface);border-radius:4px 14px 14px 4px;border-left:10px solid var(--gray);padding:12px 16px;margin:12px 0}
.report .pcard.body,.report .pcard.concl{border-left-color:var(--gray)}
.report .excerpt{color:var(--muted);font-size:.92rem;margin:2px 0 6px}
.banner{background:var(--warn-bg);border-radius:10px;padding:10px 14px;margin:12px 0}
details.teach{margin-top:34px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 16px}
details.teach summary{cursor:pointer;font-weight:700}
details.teach code{background:var(--paper);padding:1px 6px;border-radius:5px}
.msg{margin:6px 0 0;font-size:.95rem;color:var(--q)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;margin:14px 0 0}
.bar label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
.bar select{max-width:190px;padding:.35em .6em}
button.listen{padding:.15em .65em;font-size:.86rem;background:transparent;color:var(--ink);border-color:var(--line);font-weight:400;margin:4px 6px 0 0}
button.listen:hover{border-color:var(--ink)}
details.source button.listen{margin:8px 0 0}
.note-box{padding:10px 14px;border-left:10px solid var(--ink);background:var(--surface);border-radius:4px 14px 14px 4px;margin:10px 0}
.ctag{font-size:.85rem;font-weight:700;padding:0 10px;border-radius:999px;background:var(--pc-t);border:2px solid var(--pc)}
.colorkey{display:flex;flex-wrap:wrap;gap:6px 10px;margin:12px 0 0;font-size:.9rem}
.colorkey .pc{padding:2px 10px}
.formula{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:18px 0 6px;font-size:1.05rem}
.formula .pc{padding:5px 12px;border-bottom-width:4px;border-radius:6px}
.formula .plus{font-weight:700;color:var(--muted)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 16px;margin:16px 0 8px}
.settings label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
.settings select{max-width:100%}
.progress{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .3s}
.starter{margin:2px 0 8px;color:var(--muted)}
.starter span{font-style:italic;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0}
.stats div{background:var(--surface);border-left:10px solid var(--pt1);border-radius:4px 14px 14px 4px;padding:8px 14px}
.stats div:nth-child(2){border-left-color:var(--pt2)} .stats div:nth-child(3){border-left-color:var(--pt3)} .stats div:nth-child(4){border-left-color:var(--ink)}
.stats b{display:block;font-size:1.8rem;line-height:1.1}
.stats span{font-size:.88rem;color:var(--muted)}
.badge{display:inline-block;padding:0 10px;border-radius:999px;font-size:.82rem;font-weight:700;margin-left:6px}
.badge.ok{background:var(--green-t);color:var(--ok)} .badge.q{background:var(--orange-t);color:var(--q)}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-left:10px solid var(--line);border-radius:4px 14px 14px 4px;padding:10px 14px}
label.opt{cursor:pointer}
label.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);border-left-color:var(--ink)}
.opt input[type=radio]{margin-top:.45em;width:1.2em;height:1.2em;flex:none}
.opt .letter{flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.opt .txt{margin:0;flex:1}
.opt.done .txt{margin:0 0 4px}
.opt.done.best{border-left-color:var(--green);background:var(--green-t)}
.opt.done.weak{border-left-color:var(--orange)}
.opt.chosen{outline:3px solid var(--ink);outline-offset:1px}
.opt .why{margin:2px 0 0;font-size:.95rem}
.pick-h{margin:18px 0 4px;font-size:1.15rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
var UL='en',WL='en';
function L(en,es){return UL==='es'?es:en;}
function W(en,es){return WL==='es'?es:en;}

/* ---------- Topic catalog: English ---------- */
var TOPICS_EN = [
 {id:'bees', group:'Animals and nature', name:'Honeybees', blurb:'Teamwork, honey, and pollination',
  keywords:['bee','hive','honey','pollinat','colony','nectar'],
  sections:[
   {h:'Life in the Hive', p:'A honeybee colony lives in a hive and has three kinds of bees. One queen lays the eggs, thousands of female workers do most of the jobs, and a smaller number of male drones mate with queens. Workers clean the hive, feed the young, guard the entrance, and gather food. In summer, a single colony can hold tens of thousands of bees.'},
   {h:'Making Honey', p:'Workers collect nectar from flowers and carry it back to the hive. Inside, bees pass the nectar from mouth to mouth and fan it with their wings until much of the water dries out. The thick result is honey, which is stored in wax cells as food for winter. One worker bee makes only about one-twelfth of a teaspoon of honey in her whole life.'},
   {h:'Why Bees Matter', p:'As bees move from flower to flower, pollen sticks to their bodies and rubs off on the next flower. This is called pollination, and many fruits, vegetables, and nuts depend on it. Scientists estimate that about one third of the food people eat depends on pollinators such as bees.'}
  ],
  points:[
   {label:'how honeybees live and work together in the hive', facts:['A colony has one queen, many female workers, and some male drones.','Workers clean, feed the young, guard the hive, and gather food.','A summer colony can hold tens of thousands of bees.']},
   {label:'how bees make honey', facts:['Workers carry nectar from flowers back to the hive.','Bees pass nectar from mouth to mouth and fan it so the water dries out.','One worker makes only about one-twelfth of a teaspoon of honey in her life.']},
   {label:'why bees are important to people', facts:['Pollen sticks to bees and rubs off on the next flower.','Pollination helps many fruits, vegetables, and nuts grow.','About one third of our food depends on pollinators.']}
  ],
  thesis:'Honeybees work together in the hive, turn nectar into honey, and help grow much of the food people eat.'},
 {id:'octopus', group:'Animals and nature', name:'Octopuses', blurb:'Smart, strange, and good at hiding',
  keywords:['octopus','tentacle','arm','ocean','sea','invertebrate','chromatophore'],
  sections:[
   {h:'Smart Problem Solvers', p:'An octopus is an invertebrate, which means it has no backbone, yet it is one of the smartest animals in the sea. In labs, octopuses have opened jars to reach food and found their way through mazes. Their large brains and flexible arms help them test new ways to reach a goal.'},
   {h:'Amazing Bodies', p:'An octopus has eight arms, three hearts, and blue blood. Two of the hearts pump blood through the gills, and the third pumps blood to the rest of the body. Because it has no bones, an octopus can squeeze through any opening that is larger than its hard beak.'},
   {h:'Masters of Disguise', p:'Special skin cells called chromatophores let an octopus change color in a fraction of a second. Some octopuses can also change the texture of their skin to look like rocks or coral. When in danger, many octopuses squirt a cloud of dark ink and swim away.'}
  ],
  points:[
   {label:'how octopuses solve problems', facts:['An octopus has no backbone but is one of the smartest sea animals.','In labs, octopuses have opened jars and solved mazes.','Large brains and flexible arms help them try new solutions.']},
   {label:'the unusual body of an octopus', facts:['An octopus has eight arms, three hearts, and blue blood.','Two hearts serve the gills and one serves the rest of the body.','With no bones, it can fit through any gap bigger than its beak.']},
   {label:'how octopuses hide and escape', facts:['Skin cells called chromatophores change color very quickly.','Some octopuses can change skin texture to look like rocks or coral.','Many squirt dark ink to escape danger.']}
  ],
  thesis:'Octopuses are remarkable animals because they solve problems, have unusual bodies, and can disappear into their surroundings.'},
 {id:'sleep', group:'Earth, space, and health', name:'Sleep for Growing Kids', blurb:'How much you need and why',
  keywords:['sleep','bed','rest','tired','night','bedtime'],
  sections:[
   {h:'How Much Sleep', p:'Experts recommend that children ages 6 to 12 sleep 9 to 12 hours each night. Many kids get less than that, especially on school nights, which can make it harder to pay attention the next day.'},
   {h:'What Sleep Does', p:'During sleep the body grows and repairs itself. The brain also uses this time to sort through what a person learned during the day, which helps with memory. Enough sleep can improve mood, too.'},
   {h:'Better Sleep Habits', p:'Going to bed and waking up at about the same time every day helps the body keep a steady rhythm. A dark, quiet bedroom makes it easier to fall asleep. Light from screens can make it harder to fall asleep, so many experts suggest turning screens off before bedtime.'}
  ],
  points:[
   {label:'how much sleep kids need', facts:['Kids ages 6 to 12 need 9 to 12 hours each night.','Many kids get less, especially on school nights.','Too little sleep can make it harder to pay attention.']},
   {label:'what sleep does for the body and brain', facts:['The body grows and repairs itself during sleep.','The brain sorts what you learned, which helps memory.','Enough sleep can improve mood.']},
   {label:'habits that lead to better sleep', facts:['A steady bedtime and wake-up time keeps the body on a rhythm.','A dark, quiet room helps you fall asleep.','Screen light can make falling asleep harder.']}
  ],
  thesis:'Growing kids need 9 to 12 hours of sleep because sleep helps the body and brain, and good habits make it easier to get.'},
 {id:'valley', group:'Close to home', name:'Farming in the Imperial Valley', blurb:'Growing food in the desert',
  keywords:['valley','farm','desert','canal','river','crop','water','imperial','irrigat'],
  sections:[
   {h:'A Desert Farm Region', p:'The Imperial Valley is a farming region in the desert of southeastern California. In a typical year it receives only about 3 inches of rain, and summer days are very hot.'},
   {h:'Water from the Colorado River', p:'Farmers in the valley depend on water from the Colorado River, which reaches the region through the All-American Canal. A network of smaller canals and ditches then carries the water to the fields.'},
   {h:'What Grows Here', p:'The warm climate lets farmers grow crops during much of the year. In winter the valley supplies vegetables such as lettuce and broccoli, and farmers also grow alfalfa, a plant used to feed animals.'}
  ],
  points:[
   {label:'why the Imperial Valley is a desert farming region', facts:['It is in the desert of southeastern California.','It gets only about 3 inches of rain in a typical year.','Summer days are very hot.']},
   {label:'how Colorado River water reaches the fields', facts:['Farmers depend on Colorado River water.','The water arrives through the All-American Canal.','Smaller canals and ditches carry it to the fields.']},
   {label:'which crops grow in the valley', facts:['The warm climate allows crops during much of the year.','Winter vegetables include lettuce and broccoli.','Farmers also grow alfalfa to feed animals.']}
  ],
  thesis:'Although the Imperial Valley is a desert, Colorado River water and a warm climate let farmers grow food during much of the year.'},
 {id:'volcano', group:'Earth, space, and health', name:'Volcanoes', blurb:'Where they form and what they do',
  keywords:['volcano','lava','magma','eruption','erupt','crust','ash','plate'],
  sections:[
   {h:'What a Volcano Is', p:'A volcano is an opening in Earth’s crust where hot melted rock, gas, and ash escape. Melted rock below ground is called magma; once it reaches the surface it is called lava.'},
   {h:'Where Volcanoes Form', p:'Many volcanoes form where Earth’s tectonic plates meet. The Ring of Fire, a belt around the Pacific Ocean, is home to hundreds of volcanoes.'},
   {h:'Shaping the Land', p:'Eruptions can destroy. In 1980, Mount St. Helens in Washington State erupted and blasted away the top of the mountain. Eruptions can also build new land, and the Hawaiian Islands were built by volcanoes.'}
  ],
  points:[
   {label:'what a volcano is', facts:['A volcano is an opening in Earth’s crust.','Hot melted rock, gas, and ash escape through it.','Melted rock is magma underground and lava on the surface.']},
   {label:'where volcanoes form', facts:['Many form where tectonic plates meet.','The Ring of Fire circles the Pacific Ocean.','The Ring of Fire has hundreds of volcanoes.']},
   {label:'how volcanoes change the land', facts:['Eruptions can destroy land.','In 1980, Mount St. Helens lost the top of its mountain.','Volcanoes built the Hawaiian Islands.']}
  ],
  thesis:'Volcanoes are powerful forces because of what they are, where they form, and how they change the land.'},
 {id:'spacesuit', group:'Earth, space, and health', name:'Spacesuits', blurb:'A one-person spacecraft',
  keywords:['spacesuit','astronaut','space','suit','oxygen','spacewalk','nasa'],
  sections:[
   {h:'Why Astronauts Need Them', p:'Outside a spacecraft, an astronaut faces dangers that ordinary clothing could never handle. In Earth’s orbit, conditions can be as cold as 250 degrees below zero or, in sunlight, as hot as 250 degrees above. There is no air to breathe, and tiny bits of space dust move many times faster than a bullet. A spacesuit supplies oxygen and drinking water, protects the body from extreme temperatures, dust, and radiation, and has a visor to shield the eyes from bright sunlight.'},
   {h:'Parts of a Suit', p:'A modern spacewalking suit is built from several pieces, including a hard upper torso, arm sections, gloves, a helmet with a visor, and leg sections. Under the suit, an astronaut wears a tight garment with thin tubes woven into it, and cool water flows through the tubes to keep the body from overheating. On the back is a life-support backpack that holds oxygen, removes the carbon dioxide an astronaut breathes out, and provides electricity. A small set of jets called SAFER can fly an astronaut back to the station if the astronaut drifts away.'},
   {h:'Suits Through History', p:'The first American spacesuits, worn in the Mercury program, were used only inside the spacecraft. The Gemini suits made the first American spacewalks possible, but astronauts stayed connected to the spacecraft by a cord that supplied their air. Suits for the Apollo program had boots made for walking on rocky ground and carried their own life support, so astronauts could explore the moon away from their lander.'}
  ],
  points:[
   {label:'why astronauts need spacesuits', facts:['Orbit can be as cold as 250 degrees below zero or as hot as 250 degrees above.','There is no air to breathe in space.','Space dust moves many times faster than a bullet.']},
   {label:'the parts of a spacesuit', facts:['A cooling garment with water tubes goes under the suit.','A backpack holds oxygen and removes carbon dioxide.','SAFER jets can fly a drifting astronaut back to the station.']},
   {label:'how spacesuits have changed over time', facts:['Mercury suits were worn only inside the spacecraft.','Gemini suits made spacewalks possible but used a cord to the ship.','Apollo suits had walking boots and their own life support.']}
  ],
  thesis:'Spacesuits work like one-person spacecraft because they protect astronauts from space, include special parts that keep them alive, and have improved over many missions.'},
 {id:'egypt', group:'Ancient world', name:'Ancient Egypt and the Nile', blurb:'The gift of the Nile',
  keywords:['egypt','nile','pharaoh','pyramid','flood','khufu','giza'],
  sections:[
   {h:'The Gift of the Nile', p:'Egypt is mostly desert, yet the ancient Egyptians built a great civilization beside the Nile River. Each year the river flooded and left behind a layer of rich, dark soil. When the water drained away, farmers planted their seeds in the moist ground. The Greek historian Herodotus called Egypt the “gift of the Nile.”'},
   {h:'A Tomb for a King', p:'Egypt was ruled by kings called pharaohs. Pharaohs built enormous stone pyramids as tombs, and the triangle shape stood for the first hill of creation, from which a king hoped to be reborn in the afterlife. The biggest pyramids stand at Giza, on the west bank of the Nile.'},
   {h:'Building a Giant', p:'The Great Pyramid was built for the pharaoh Khufu about 4,500 years ago. Workers needed about 20 years and more than 2 million blocks of stone to finish it, and it rose to roughly 480 feet. Because farming was impossible while the Nile covered the fields, historians think many farmers worked on building projects during the flood.'}
  ],
  points:[
   {label:'how the Nile made farming possible', facts:['The Nile flooded every year and left rich soil.','Farmers planted after the floodwater drained away.','Herodotus called Egypt the “gift of the Nile.”']},
   {label:'why pharaohs built pyramids', facts:['Pharaohs were Egypt’s kings.','Pyramids were tombs that helped a king hope for rebirth.','The biggest pyramids stand at Giza.']},
   {label:'how the Great Pyramid was built', facts:['It was built for Khufu about 4,500 years ago.','It took about 20 years and more than 2 million stone blocks.','Farmers may have worked on it while floods covered the fields.']}
  ],
  thesis:'The Nile made ancient Egyptian civilization possible by feeding farmers, inspiring pyramid tombs for pharaohs, and supporting huge building projects like the Great Pyramid.'},
 {id:'hammurabi', group:'Ancient world', name:'Hammurabi’s Code', blurb:'One of the first written sets of laws',
  keywords:['hammurabi','babylon','code','law','laws','stele','mesopotamia'],
  sections:[
   {h:'A King and His Laws', p:'Hammurabi was a king of Babylon, a powerful city in Mesopotamia, who ruled until about 1750 BCE. Near the end of his reign, his judgments were collected into a set of 282 laws. The laws covered family, property, trade, and work.'},
   {h:'Laws Carved in Stone', p:'The laws were carved in cuneiform writing on a tall black stone pillar, called a stele, that stood about 7 feet high. At the top, a picture shows Hammurabi standing before Shamash, the sun god and god of justice. Because the pillar was put on public display, people could see what the rules were.'},
   {h:'An Eye for an Eye', p:'Most laws followed an “if, then” pattern: if a certain thing happened, then a certain punishment followed. One famous law says that a man who puts out another man’s eye will have his own eye put out. This idea tried to make the punishment match the harm. However, punishments could be different depending on a person’s social class.'}
  ],
  points:[
   {label:'who Hammurabi was and what his code contained', facts:['Hammurabi was a king of Babylon until about 1750 BCE.','His judgments were gathered into 282 laws.','The laws covered family, property, trade, and work.']},
   {label:'how the laws were recorded and shown', facts:['The laws were carved on a black stone pillar about 7 feet tall.','A picture shows Hammurabi with the sun god Shamash.','The pillar was displayed in public so people could see the rules.']},
   {label:'how the laws worked and punished', facts:['The laws followed an if-then pattern.','One law set an eye for an eye as the punishment.','Punishments could depend on a person’s social class.']}
  ],
  thesis:'Hammurabi’s Code shows how an ancient king gathered his laws, displayed them in public, and used clear rules to punish wrongdoing.'},
 {id:'athens', group:'Ancient world', name:'Democracy in Ancient Athens', blurb:'Citizens ruling themselves',
  keywords:['athens','athenian','democracy','citizen','assembly','cleisthenes','greek','greece','vote'],
  sections:[
   {h:'The Birth of Democracy', p:'About 2,500 years ago, the Greek city-state of Athens began a new kind of government. Around 508 BCE, a leader named Cleisthenes reformed the laws so that ordinary citizens, and not just powerful families, had a say. He is often called the father of Athenian democracy. The word democracy comes from Greek words meaning “people” and “power.”'},
   {h:'How It Worked', p:'Athens had a direct democracy, which means citizens voted on laws themselves instead of choosing representatives. The Assembly met about 40 times a year, and every male citizen could attend and vote. A Council of 500 citizens, chosen by lottery, prepared the matters the Assembly would discuss. Citizens could also vote to send a dangerous leader into exile for 10 years.'},
   {h:'Who Was Left Out', p:'Athenian democracy was limited. Only free men born to Athenian parents could take part. Women, enslaved people, and foreigners living in Athens could not vote. Sparta, a rival city-state, built its government around military training and discipline instead.'}
  ],
  points:[
   {label:'how democracy began in Athens', facts:['Cleisthenes reformed Athens around 508 BCE.','He is called the father of Athenian democracy.','Democracy comes from Greek words for people and power.']},
   {label:'how Athenian democracy worked', facts:['Citizens voted on laws directly.','The Assembly met about 40 times a year.','A Council of 500 chosen by lottery planned the Assembly’s work.']},
   {label:'who was left out of Athenian democracy', facts:['Only free men born to Athenian parents could vote.','Women, enslaved people, and foreigners were left out.','Sparta focused on military training instead.']}
  ],
  thesis:'Athens created an early democracy by giving citizens power through an assembly and a council, but it left out many people.'},
 {id:'silkroad', group:'Ancient world', name:'The Silk Road', blurb:'A web of trade routes',
  keywords:['silk','road','roads','route','routes','trade','china','caravan','han'],
  sections:[
   {h:'A Network, Not One Road', p:'The Silk Road was not a single road. It was a network of trade routes that linked China with the lands around the Mediterranean Sea. Trade along the routes grew during the Han dynasty of China, more than 2,000 years ago, and the whole system stretched about 4,000 miles. Few traders traveled the whole way. Goods usually passed from merchant to merchant along the route.'},
   {h:'Goods and Ideas', p:'Silk was the most famous product, and it traveled west. Wool, gold, and silver traveled east, and spices, tea, and porcelain were also traded. Inventions such as paper moved along the routes as well. Ideas traveled too, and Buddhism spread from India into China along the Silk Road.'},
   {h:'Dangers and Decline', p:'Travelers crossed deserts and high mountains, and caravans stopped at oasis towns for water, food, and rest. Diseases also traveled along the routes. Over time, faster sea routes made overland trade less important, and in 1453 the Ottoman Empire closed off trade with the West.'}
  ],
  points:[
   {label:'what the Silk Road was', facts:['It was a network of routes, not one road.','It linked China with the Mediterranean world.','It stretched about 4,000 miles.']},
   {label:'what traders and travelers exchanged', facts:['Silk traveled west while wool, gold, and silver traveled east.','Paper and spices moved along the routes.','Buddhism spread from India to China.']},
   {label:'the dangers of the journey and why the routes declined', facts:['Travelers crossed deserts and high mountains.','Diseases also spread along the routes.','Sea routes grew, and in 1453 the Ottoman Empire closed off trade with the West.']}
  ],
  thesis:'The Silk Road mattered because it connected distant lands, carried goods and ideas, and faced dangers and changes that eventually ended overland trade.'},
 {id:'pottery', group:'Ancient world', name:'The World’s Oldest Pottery', blurb:'Clay pots from the ice age',
  keywords:['pottery','pot','pots','clay','cave','xianrendong','china','cooking'],
  sections:[
   {h:'A Surprise in a Cave', p:'In Xianrendong Cave in Jiangxi Province, China, scientists found broken pieces of clay pots that are about 20,000 years old. They are the oldest pottery known. The finding was reported in 2012. For years, many experts had believed that pottery began only after people started farming, about 10,000 years ago.'},
   {h:'Cooks of the Ice Age', p:'The people who made these pots were hunter-gatherers who moved from place to place during the last ice age. Many pieces have scorch marks, which suggests that the pots were set over fires for cooking. Cooking in clay pots could help people get more energy from starchy foods and meat when food was hard to find.'},
   {h:'Changing the Story', p:'The discovery showed that pottery was invented at least 10,000 years before farming began in that part of the world. It also showed that people were cooking in clay pots long before there were fields or cities. Radiocarbon dating of bone and charcoal found beside the pottery helped scientists tell how old the pieces were.'}
  ],
  points:[
   {label:'what scientists found in the cave', facts:['The pottery pieces are about 20,000 years old.','They came from Xianrendong Cave in Jiangxi Province, China.','They are the oldest pottery known.']},
   {label:'how the first pots were used', facts:['The pots were made by people who hunted and gathered food.','Scorch marks suggest the pots were used for cooking.','Cooking helped people get more energy from food.']},
   {label:'how the discovery changed ideas about early people', facts:['Experts once thought pottery began with farming about 10,000 years ago.','These pots came at least 10,000 years before farming began there.','Radiocarbon dating of bone and charcoal showed their age.']}
  ],
  thesis:'The oldest pottery, found in a Chinese cave, matters because of what scientists found, how ice age people used it, and how it changed ideas about early humans.'},
 {id:'monarch', group:'Animals and nature', name:'Monarch Butterfly Migration', blurb:'A journey of thousands of miles',
  keywords:['monarch','butterfly','butterflies','migration','migrate','milkweed','mexico'],
  sections:[
   {h:'A Long Journey South', p:'Monarch butterflies cannot survive cold northern winters, so each fall they travel south. Monarchs that live east of the Rocky Mountains fly up to about 3,000 miles to forests in central Mexico, while monarchs in the West usually spend the winter along the California coast. They use air currents to help them glide as they travel.'},
   {h:'Generations on the Move', p:'The monarchs that fly south are different from the summer ones. A summer monarch lives only a few weeks, but the migrating generation can live up to 9 months. In spring, these monarchs fly north and lay eggs, and it takes several new generations to spread across North America again. Amazingly, the butterflies that reach Mexico have never been there before.'},
   {h:'Milkweed and Danger', p:'Monarch caterpillars eat only milkweed, and females lay their eggs only on milkweed plants. In many places, milkweed has been lost to farms, roads, and buildings. Monarch numbers have also dropped because of pesticides and climate change. People can help by planting milkweed and flowers that provide nectar.'}
  ],
  points:[
   {label:'where monarchs travel each year', facts:['Eastern monarchs fly up to about 3,000 miles to Mexico.','Western monarchs spend winter along the California coast.','They glide on air currents.']},
   {label:'how generations carry the migration', facts:['Summer monarchs live a few weeks, but the migrating generation lives up to 9 months.','It takes several generations to spread north again.','The butterflies that reach Mexico have never been there before.']},
   {label:'why monarchs need milkweed and help', facts:['Caterpillars eat only milkweed.','Milkweed has been lost to farms, roads, and buildings.','Planting milkweed and flowers can help.']}
  ],
  thesis:'Monarch butterflies make an amazing migration because of the distance they travel, the generations that carry it on, and the milkweed they need to survive.'},
 {id:'salton', group:'Close to home', name:'The Salton Sea', blurb:'California’s accidental lake',
  keywords:['salton','sea','lake','colorado','river','imperial','bird','birds','flyway','salt','salinity'],
  sections:[
   {h:'An Accidental Lake', p:'The Salton Sea is California’s largest lake, and it was created by accident. In 1905, floodwaters from the Colorado River broke through an irrigation canal meant to carry water to the Imperial Valley. For roughly 2 years, the river poured into a dry desert basin before workers closed the gap.'},
   {h:'A Stop for Birds', p:'The Salton Sea sits on the Pacific Flyway, a route that birds follow between the Arctic and South America. More than 400 kinds of birds have been seen there, and many stop to rest and feed. Wetlands have disappeared across California, so places like the Salton Sea matter even more to migrating birds.'},
   {h:'A Shrinking, Salty Sea', p:'The sea has no outlet, so water leaves only by evaporating, which leaves the salt behind. Farm runoff from the Imperial Valley has helped keep the sea full, but less water has flowed in over the years, and the sea has been shrinking. It is now saltier than the ocean, and exposed lake bed can blow dust into the air. People are working on projects to help the sea and its wildlife.'}
  ],
  points:[
   {label:'how the Salton Sea was formed', facts:['The Colorado River flooded through a canal in 1905.','Water poured into a dry basin for roughly 2 years.','It became California’s largest lake.']},
   {label:'why the sea matters to birds', facts:['The sea is on the Pacific Flyway.','More than 400 kinds of birds have been seen there.','Other wetlands in California have disappeared.']},
   {label:'why the sea is shrinking and growing saltier', facts:['Water leaves only by evaporation, which leaves salt behind.','Less farm runoff flows into the sea than before.','It is saltier than the ocean, and dust from the dry lake bed is a concern.']}
  ],
  thesis:'The Salton Sea is an important and troubled place because of how it formed, the birds it supports, and the problems of a shrinking, salty lake.'},
 {id:'animaldef', group:'Animals and nature', name:'Animal Defenses', blurb:'How animals stay safe from predators',
  keywords:['animal','defense','defenses','predator','camouflage','armor','spine','quill'],
  sections:[
   {h:'Armor and Spines', p:'Some animals carry their protection on their bodies. Turtles have hard shells, armadillos have bony plates, and some armadillos can roll into a ball. A hedgehog curls up so that only its spines show. A porcupine cannot shoot its quills, but its barbed quills come loose easily when a predator touches them.'},
   {h:'Color Tricks', p:'Many animals avoid attacks by blending in. An Arctic hare has white fur that matches the snow, and a cuttlefish can change its skin color and pattern. Other animals do the opposite and use bright colors as a warning. The bold colors of a poison dart frog tell predators that its skin is toxic.'},
   {h:'Smells and Tricks', p:'A skunk sprays a foul-smelling liquid that can linger for days, and a bombardier beetle shoots out a hot chemical spray. A Virginia opossum may fall limp and seem to be dead, which is called playing possum. Predators that want fresh food often lose interest and move on.'}
  ],
  points:[
   {label:'how armor and spines protect animals', facts:['Turtles have hard shells and armadillos have bony plates.','A hedgehog curls up so only its spines show.','Porcupine quills come loose easily but cannot be shot.']},
   {label:'how color helps animals hide or warn', facts:['An Arctic hare’s white fur matches snow.','A cuttlefish can change its color and pattern.','A poison dart frog’s bright colors warn of toxins.']},
   {label:'how smells and tricks drive predators away', facts:['A skunk sprays a foul-smelling liquid.','A bombardier beetle shoots a hot chemical spray.','An opossum plays dead so predators lose interest.']}
  ],
  thesis:'Animals protect themselves from predators in many ways, including armor and spines, color tricks, and smells or clever behavior.'},
 {id:'hurricane', group:'Earth, space, and health', name:'Hurricanes', blurb:'How giant storms form and why people prepare',
  keywords:['hurricane','storm','ocean','wind','eye','eyewall','surge','tropical'],
  sections:[
   {h:'How a Hurricane Forms', p:'A hurricane is a giant spinning storm that forms over warm ocean water. The water needs to be at least about 80 degrees Fahrenheit, because warm water gives the storm its energy. As warm, moist air rises, it makes thunderstorms, and more air rushes in underneath to take its place. The spinning of Earth helps the whole system turn. When its winds reach 74 miles per hour, the storm is called a hurricane.'},
   {h:'Parts of the Storm', p:'The center of a hurricane is called the eye, where the air is calm and the sky is sometimes clear. Around the eye is the eyewall, a ring of thunderstorms with the strongest winds and the heaviest rain. Spiral rainbands stretch out for hundreds of miles. Scientists rate hurricanes from Category 1 to Category 5 based on their wind speed.'},
   {h:'Staying Safe', p:'The Atlantic hurricane season runs from June 1 to November 30. Wind is dangerous, but storm surge, a rise in sea level pushed onto land, is often the deadliest part of a hurricane. Because the 1-to-5 scale only measures wind, even a lower-category hurricane can cause deadly flooding. Forecasters track storms so that people can prepare or evacuate.'}
  ],
  points:[
   {label:'how a hurricane forms', facts:['Hurricanes form over ocean water that is at least about 80 degrees Fahrenheit.','Warm, moist air rises and makes thunderstorms.','A storm becomes a hurricane when its winds reach 74 miles per hour.']},
   {label:'the parts of a hurricane', facts:['The eye at the center is calm.','The eyewall has the strongest winds and the heaviest rain.','Hurricanes are rated from Category 1 to Category 5 by wind speed.']},
   {label:'how people stay safe', facts:['The Atlantic hurricane season runs from June 1 to November 30.','Storm surge is often the deadliest part of a hurricane.','Forecasters track storms so people can prepare or evacuate.']}
  ],
  thesis:'Hurricanes are powerful storms because of how they form over warm water, how they are built around an eye and an eyewall, and why people must prepare for them.'},
 {id:'coral', group:'Animals and nature', name:'Coral Reefs', blurb:'The rainforests of the sea',
  keywords:['coral','reef','ocean','algae','bleaching','polyp','sea'],
  sections:[
   {h:'Animals That Build Stone Homes', p:'Corals may look like rocks or plants, but they are animals. A coral is made of tiny soft-bodied animals called polyps, and each polyp builds a hard skeleton around itself. Over many years, these skeletons pile up to form a coral reef. Tiny algae called zooxanthellae live inside the corals, make food from sunlight, and give corals their bright colors.'},
   {h:'A City Under the Sea', p:'Coral reefs cover less than 1 percent of the ocean floor, yet about 25 percent of all ocean species live in or around them. Fish, crabs, sea turtles, and many other animals find food and shelter there, which is why reefs are called the rainforests of the sea. The largest coral reef in the world is Australia’s Great Barrier Reef, which is more than 1,000 miles long. Reefs also protect coasts by weakening waves during storms.'},
   {h:'Trouble From Warm Water', p:'When the ocean gets too warm, corals become stressed and push out the algae living inside them. Without the algae, the coral turns white, which is called bleaching, and it loses its main source of food. A bleached coral can recover if the water cools down, but long periods of heat can kill it. Pollution that runs into the sea can also harm reefs.'}
  ],
  points:[
   {label:'how corals build reefs', facts:['Corals are animals made of tiny polyps.','Each polyp builds a hard skeleton around itself.','Algae inside the corals make food and give them color.']},
   {label:'why reefs are important', facts:['Reefs cover less than 1 percent of the ocean floor.','About 25 percent of ocean species live in or around reefs.','Reefs protect coasts by weakening waves in storms.']},
   {label:'what harms coral reefs', facts:['Warm water makes corals push out their algae.','Without algae, corals turn white in what is called bleaching.','Pollution that runs into the sea can also harm reefs.']}
  ],
  thesis:'Coral reefs are important living structures because of how corals build them, the huge number of animals they shelter, and the dangers they face from warming water.'},
 {id:'aqueduct', group:'Ancient world', name:'Roman Aqueducts', blurb:'Bringing water to a city by gravity',
  keywords:['aqueduct','roman','rome','water','arch','arches','pont','gravity'],
  sections:[
   {h:'Water for a Growing City', p:'Ancient Rome grew so large that nearby wells and springs could not supply enough water. In 312 BCE, the Romans built their first aqueduct, the Aqua Appia, which carried water about 10 miles into the city. Over the next several centuries, Rome built 11 aqueducts, and the city grew to about 1 million people. The water filled public fountains and baths and supplied some homes.'},
   {h:'How Gravity Did the Work', p:'Aqueducts had no pumps. Engineers used gravity by building the channel with a gentle downhill slope all the way from the spring to the city. If the slope was too steep, the water could damage the channel, and if it was too flat, the water would barely move. Most of the channel ran underground, and arched bridges were built only where the water had to cross a valley.'},
   {h:'Built to Last', p:'The Pont du Gard, an aqueduct bridge in France, was built around 19 BCE. It has three tiers of arches and stands almost 160 feet high. The Romans made aqueducts from stone, brick, and a strong concrete. Some parts are still used today, and the Aqua Virgo still brings water to the Trevi Fountain in Rome.'}
  ],
  points:[
   {label:'why Rome needed aqueducts', facts:['Rome grew too large for nearby wells and springs.','The first aqueduct, built in 312 BCE, carried water about 10 miles.','Rome eventually built 11 aqueducts for about 1 million people.']},
   {label:'how aqueducts worked', facts:['Gravity moved the water, with no pumps.','Engineers built a gentle downhill slope from the spring to the city.','Arched bridges were used only to cross valleys.']},
   {label:'why aqueducts lasted', facts:['The Pont du Gard was built around 19 BCE and stands almost 160 feet high.','The Romans used stone, brick, and strong concrete.','The Aqua Virgo still brings water to the Trevi Fountain.']}
  ],
  thesis:'Roman aqueducts mattered because a growing city needed water, engineers used gravity to deliver it, and their sturdy design has lasted for about two thousand years.'},
 {id:'kush', group:'Ancient world', name:'The Kingdom of Kush', blurb:'Nile rulers who conquered Egypt',
  keywords:['kush','nubia','nile','egypt','meroe','pyramid','piye','napata','sudan'],
  sections:[
   {h:'A Kingdom on the Nile', p:'The Kingdom of Kush was an ancient African kingdom in a region called Nubia, along the Nile River in what is now northern Sudan. Kush traded gold, ebony, and ivory with its neighbors. For hundreds of years it was ruled from the city of Napata, and later from Meroë. The kingdom lasted for many centuries.'},
   {h:'The Black Pharaohs', p:'Around 730 BCE, a Kushite king named Piye marched north and conquered Egypt. He became the first ruler of Egypt’s twenty-fifth dynasty, whose kings are often called the Black Pharaohs. The Kushite kings ruled Egypt for many decades, restored old temples, and even built pyramids. Their rule ended when the Assyrians invaded Egypt.'},
   {h:'Iron and Pyramids at Meroë', p:'After the Assyrians drove them out of Egypt, the Kushites ruled from farther south. Meroë became the capital, and historians think the region’s forests, which supplied fuel for iron furnaces, helped make it a center of iron working. The Kushites also built many steep, narrow pyramids at Meroë, which are smaller than Egypt’s. Today the pyramids of Meroë are a UNESCO World Heritage site.'}
  ],
  points:[
   {label:'what the Kingdom of Kush was', facts:['Kush was an ancient African kingdom in Nubia, along the Nile.','It was in what is now northern Sudan.','Kush traded gold, ebony, and ivory.']},
   {label:'how Kush conquered Egypt', facts:['King Piye conquered Egypt around 730 BCE.','The kings of Egypt’s twenty-fifth dynasty are called the Black Pharaohs.','They restored old temples and built pyramids.']},
   {label:'what Meroë was known for', facts:['Meroë became the capital of Kush.','Nearby forests helped make Meroë a center of iron working.','The pyramids of Meroë are a UNESCO World Heritage site.']}
  ],
  thesis:'The Kingdom of Kush was a powerful African civilization because of its place along the Nile, its conquest of Egypt, and its achievements at Meroë.'},
 {id:'solar', group:'Earth, space, and health', name:'Solar Power', blurb:'Turning sunlight into electricity',
  keywords:['solar','sun','sunlight','panel','electricity','energy','cell','inverter'],
  sections:[
   {h:'Sunlight Into Electricity', p:'A solar panel is made of many photovoltaic cells, usually made of silicon. When sunlight hits a cell, it knocks tiny particles called electrons loose, and an electric field inside the cell pushes them in one direction. This steady flow is an electric current. The panels have no moving parts and use the light of the sun, not its heat.'},
   {h:'Getting Power to a Home', p:'Solar panels make direct current, or DC, electricity, but homes use alternating current, or AC. A device called an inverter changes DC into AC. A home can use the electricity right away, send extra power back to the electric grid, or store it in a battery for later. Panels make less electricity on cloudy days and none at night.'},
   {h:'Why People Use Solar Energy', p:'Sunlight is a renewable energy source, which means it will not run out. Solar panels do not burn fuel, so they make electricity without producing air pollution while they work. Solar energy can also power places that are far from power lines. One challenge is that the sun does not shine all the time, so batteries or the grid are needed when it is dark.'}
  ],
  points:[
   {label:'how solar panels make electricity', facts:['Solar panels have photovoltaic cells, usually made of silicon.','Sunlight knocks electrons loose and creates an electric current.','Panels use the light of the sun, not its heat.']},
   {label:'how the electricity reaches a home', facts:['Panels make DC electricity, but homes use AC.','An inverter changes DC into AC.','Extra power can go to the grid or into a battery.']},
   {label:'why people choose solar power', facts:['Sunlight is a renewable source that will not run out.','Solar panels make electricity without burning fuel.','The sun does not shine at night, so batteries or the grid are needed.']}
  ],
  thesis:'Solar power turns sunlight into electricity with photovoltaic cells, delivers it to homes with an inverter, and gives people a renewable energy choice.'}

];

 {id:'bees', group:'Animales y naturaleza', name:'Las abejas melíferas', blurb:'Trabajo en equipo, miel y polinización',

   {h:'La vida en la colmena', p:'Una colonia de abejas melíferas vive en una colmena y tiene tres tipos de abejas. Una reina pone los huevos, miles de obreras hembras hacen casi todo el trabajo y un número menor de zánganos machos se aparean con las reinas. Las obreras limpian la colmena, alimentan a las crías, vigilan la entrada y buscan comida. En verano, una sola colonia puede tener decenas de miles de abejas.'},
   {h:'Cómo se hace la miel', p:'Las obreras recogen el néctar de las flores y lo llevan a la colmena. Dentro, las abejas se pasan el néctar de boca en boca y lo abanican con las alas hasta que gran parte del agua se seca. El resultado espeso es la miel, que se guarda en celdas de cera como alimento para el invierno. Una abeja obrera produce solo cerca de una doceava parte de una cucharadita de miel en toda su vida.'},
   {h:'Por qué importan las abejas', p:'Cuando las abejas pasan de flor en flor, el polen se les pega al cuerpo y se desprende en la siguiente flor. Esto se llama polinización, y de ella dependen muchas frutas, verduras y nueces. Los científicos calculan que cerca de la tercera parte de los alimentos que come la gente depende de polinizadores como las abejas.'}
  ],
  points:[
   {label:'cómo viven y trabajan juntas las abejas en la colmena', facts:['Una colonia tiene una reina, muchas obreras hembras y algunos zánganos machos.','Las obreras limpian, alimentan a las crías, vigilan la colmena y buscan comida.','Una colonia en verano puede tener decenas de miles de abejas.']},
   {label:'cómo hacen miel las abejas', facts:['Las obreras llevan el néctar de las flores a la colmena.','Las abejas se pasan el néctar de boca en boca y lo abanican para que se seque el agua.','Una obrera produce solo cerca de una doceava parte de una cucharadita de miel en su vida.']},
   {label:'por qué las abejas son importantes para las personas', facts:['El polen se pega a las abejas y se desprende en la siguiente flor.','La polinización ayuda a que crezcan muchas frutas, verduras y nueces.','Cerca de la tercera parte de los alimentos depende de los polinizadores.']}
  ],
  thesis:'Las abejas melíferas trabajan juntas en la colmena, convierten el néctar en miel y ayudan a producir gran parte de los alimentos que come la gente.'},
 {id:'octopus', group:'Animales y naturaleza', name:'Los pulpos', blurb:'Inteligentes, raros y buenos para esconderse',
  keywords:['pulpo','tentacul','brazo','oceano','mar','invertebrado','cromatoforo'],
  sections:[
   {h:'Expertos en resolver problemas', p:'Un pulpo es un invertebrado, es decir, no tiene columna vertebral, pero es uno de los animales más inteligentes del mar. En laboratorios, los pulpos han abierto frascos para llegar a la comida y han encontrado la salida de laberintos. Su cerebro grande y sus brazos flexibles los ayudan a probar nuevas maneras de lograr una meta.'},
   {h:'Cuerpos asombrosos', p:'Un pulpo tiene ocho brazos, tres corazones y sangre azul. Dos de los corazones envían la sangre a las branquias y el tercero la envía al resto del cuerpo. Como no tiene huesos, un pulpo puede pasar por cualquier abertura que sea más grande que su pico duro.'},
   {h:'Maestros del disfraz', p:'Unas células especiales de la piel, llamadas cromatóforos, le permiten al pulpo cambiar de color en una fracción de segundo. Algunos pulpos también pueden cambiar la textura de la piel para parecerse a rocas o a coral. Cuando están en peligro, muchos pulpos lanzan una nube de tinta oscura y se alejan nadando.'}
  ],
  points:[
   {label:'cómo los pulpos resuelven problemas', facts:['Un pulpo no tiene columna vertebral, pero es uno de los animales marinos más inteligentes.','En laboratorios, los pulpos han abierto frascos y resuelto laberintos.','Su cerebro grande y sus brazos flexibles les ayudan a probar nuevas soluciones.']},
   {label:'el cuerpo poco común de un pulpo', facts:['Un pulpo tiene ocho brazos, tres corazones y sangre azul.','Dos corazones sirven a las branquias y uno sirve al resto del cuerpo.','Sin huesos, puede pasar por cualquier espacio más grande que su pico.']},
   {label:'cómo los pulpos se esconden y escapan', facts:['Unas células de la piel llamadas cromatóforos cambian de color muy rápido.','Algunos pulpos pueden cambiar la textura de la piel para parecerse a rocas o a coral.','Muchos lanzan tinta oscura para escapar del peligro.']}
  ],
  thesis:'Los pulpos son animales extraordinarios porque resuelven problemas, tienen cuerpos poco comunes y pueden desaparecer en su entorno.'},
 {id:'sleep', group:'La Tierra, el espacio y la salud', name:'El sueño de los niños en crecimiento', blurb:'Cuánto se necesita y por qué',
  keywords:['sueno','dormir','duerm','cama','descans','cansad','noche'],
  sections:[
   {h:'Cuánto sueño se necesita', p:'Los expertos recomiendan que los niños de 6 a 12 años duerman de 9 a 12 horas cada noche. Muchos niños duermen menos que eso, sobre todo en las noches de escuela, y eso puede hacer más difícil prestar atención al día siguiente.'},
   {h:'Lo que hace el sueño', p:'Durante el sueño, el cuerpo crece y se repara. El cerebro también aprovecha ese tiempo para ordenar lo que la persona aprendió durante el día, lo cual ayuda a la memoria. Dormir lo suficiente también puede mejorar el estado de ánimo.'},
   {h:'Mejores hábitos para dormir', p:'Acostarse y levantarse a la misma hora todos los días ayuda a que el cuerpo mantenga un ritmo constante. Un cuarto oscuro y tranquilo facilita quedarse dormido. La luz de las pantallas puede dificultar el sueño, por eso muchos expertos sugieren apagar las pantallas antes de acostarse.'}
  ],
  points:[
   {label:'cuánto sueño necesitan los niños', facts:['Los niños de 6 a 12 años necesitan de 9 a 12 horas cada noche.','Muchos duermen menos, sobre todo en las noches de escuela.','Dormir poco puede dificultar la atención.']},
   {label:'lo que hace el sueño por el cuerpo y el cerebro', facts:['El cuerpo crece y se repara durante el sueño.','El cerebro ordena lo que se aprendió, y eso ayuda a la memoria.','Dormir lo suficiente puede mejorar el estado de ánimo.']},
   {label:'hábitos que ayudan a dormir mejor', facts:['Una hora fija para acostarse y levantarse mantiene al cuerpo en ritmo.','Un cuarto oscuro y tranquilo ayuda a quedarse dormido.','La luz de las pantallas puede dificultar el sueño.']}
  ],
  thesis:'Los niños en crecimiento necesitan de 9 a 12 horas de sueño porque dormir ayuda al cuerpo y al cerebro, y los buenos hábitos facilitan lograrlo.'},
 {id:'valley', group:'Cerca de casa', name:'La agricultura en el Valle Imperial', blurb:'Cultivar alimentos en el desierto',

   {h:'Agua del río Colorado', p:'Los agricultores del valle dependen del agua del río Colorado, que llega a la región por el Canal Todo Americano. Una red de canales y zanjas más pequeños lleva después el agua a los campos.'},
   {h:'Qué se cultiva aquí', p:'El clima cálido permite a los agricultores cultivar durante gran parte del año. En invierno, el valle abastece verduras como lechuga y brócoli, y los agricultores también cultivan alfalfa, una planta que sirve para alimentar animales.'}

 {id:'volcano', group:'La Tierra, el espacio y la salud', name:'Los volcanes', blurb:'Dónde se forman y qué hacen',
  keywords:['volcan','lava','magma','erupcion','corteza','ceniza','placa'],
  sections:[
   {h:'Qué es un volcán', p:'Un volcán es una abertura en la corteza de la Tierra por donde escapan roca caliente derretida, gases y ceniza. La roca derretida bajo tierra se llama magma; cuando llega a la superficie se llama lava.'},
   {h:'Dónde se forman los volcanes', p:'Muchos volcanes se forman donde se encuentran las placas tectónicas de la Tierra. El Cinturón de Fuego, una franja alrededor del océano Pacífico, alberga cientos de volcanes.'},
   {h:'Cómo cambian el paisaje', p:'Las erupciones pueden destruir. En 1980, el monte St. Helens, en el estado de Washington, hizo erupción y voló la cima de la montaña. Las erupciones también pueden crear tierra nueva, y las islas de Hawái se formaron por volcanes.'}
  ],
  points:[
   {label:'qué es un volcán', facts:['Un volcán es una abertura en la corteza de la Tierra.','Por ella escapan roca caliente derretida, gases y ceniza.','La roca derretida es magma bajo tierra y lava en la superficie.']},
   {label:'dónde se forman los volcanes', facts:['Muchos se forman donde se encuentran las placas tectónicas.','El Cinturón de Fuego rodea el océano Pacífico.','El Cinturón de Fuego tiene cientos de volcanes.']},
   {label:'cómo los volcanes cambian la tierra', facts:['Las erupciones pueden destruir tierra.','En 1980, el monte St. Helens perdió la cima de su montaña.','Los volcanes formaron las islas de Hawái.']}
  ],
  thesis:'Los volcanes son fuerzas poderosas por lo que son, por dónde se forman y por cómo cambian la tierra.'},
 {id:'spacesuit', group:'La Tierra, el espacio y la salud', name:'Los trajes espaciales', blurb:'Una nave espacial para una persona',
  keywords:['traje','astronaut','espacio','oxigeno','caminata','nasa','espacial'],
  sections:[
   {h:'Por qué los astronautas los necesitan', p:'Fuera de una nave espacial, un astronauta enfrenta peligros que la ropa común nunca podría soportar. En la órbita de la Tierra, las condiciones pueden ser tan frías como 250 grados bajo cero o, bajo el sol, tan calientes como 250 grados sobre cero. No hay aire para respirar, y pequeños trozos de polvo espacial se mueven muchas veces más rápido que una bala. Un traje espacial proporciona oxígeno y agua para beber, protege el cuerpo de temperaturas extremas, polvo y radiación, y tiene una visera que protege los ojos de la luz brillante del sol.'},
   {h:'Partes de un traje', p:'Un traje moderno para caminatas espaciales se arma con varias piezas, como un torso superior rígido, secciones para los brazos, guantes, un casco con visera y secciones para las piernas. Debajo del traje, el astronauta lleva una prenda ajustada con tubos delgados tejidos, y por los tubos corre agua fría para que el cuerpo no se sobrecaliente. En la espalda hay una mochila de soporte vital que guarda oxígeno, elimina el dióxido de carbono que el astronauta exhala y proporciona electricidad. Un pequeño conjunto de propulsores llamado SAFER puede llevar de regreso a la estación a un astronauta que se aleje flotando.'},
   {h:'Trajes a lo largo de la historia', p:'Los primeros trajes espaciales estadounidenses, usados en el programa Mercury, se usaban solo dentro de la nave. Los trajes Gemini hicieron posibles las primeras caminatas espaciales de Estados Unidos, pero los astronautas seguían conectados a la nave por un cable que les daba aire. Los trajes del programa Apolo tenían botas hechas para caminar sobre terreno rocoso y llevaban su propio soporte vital, así que los astronautas podían explorar la Luna lejos de su módulo de aterrizaje.'}
  ],
  points:[
   {label:'por qué los astronautas necesitan trajes espaciales', facts:['La órbita puede ser tan fría como 250 grados bajo cero o tan caliente como 250 grados sobre cero.','En el espacio no hay aire para respirar.','El polvo espacial se mueve muchas veces más rápido que una bala.']},
   {label:'las partes de un traje espacial', facts:['Una prenda de enfriamiento con tubos de agua va debajo del traje.','Una mochila guarda oxígeno y elimina dióxido de carbono.','Los propulsores SAFER pueden llevar de regreso a la estación a un astronauta que flota a la deriva.']},
   {label:'cómo han cambiado los trajes espaciales con el tiempo', facts:['Los trajes Mercury se usaban solo dentro de la nave.','Los trajes Gemini hicieron posibles las caminatas espaciales, pero usaban un cable a la nave.','Los trajes Apolo tenían botas para caminar y su propio soporte vital.']}
  ],
  thesis:'Los trajes espaciales funcionan como naves de una sola persona porque protegen a los astronautas del espacio, tienen partes especiales que los mantienen vivos y han mejorado con muchas misiones.'},
 {id:'egypt', group:'El mundo antiguo', name:'El antiguo Egipto y el Nilo', blurb:'El regalo del Nilo',
  keywords:['egipto','nilo','faraon','piramide','inundacion','keops','guiza','giza'],
  sections:[
   {h:'El regalo del Nilo', p:'Egipto es en su mayor parte desierto, pero los antiguos egipcios construyeron una gran civilización junto al río Nilo. Cada año el río se desbordaba y dejaba una capa de tierra oscura y fértil. Cuando el agua se retiraba, los agricultores sembraban sus semillas en la tierra húmeda. El historiador griego Heródoto llamó a Egipto el «regalo del Nilo».'},
   {h:'Una tumba para un rey', p:'Egipto era gobernado por reyes llamados faraones. Los faraones construían enormes pirámides de piedra como tumbas, y la forma de triángulo representaba la primera colina de la creación, de la cual un rey esperaba renacer en la otra vida. Las pirámides más grandes están en Guiza, en la orilla oeste del Nilo.'},
   {h:'Construir un gigante', p:'La Gran Pirámide se construyó para el faraón Keops hace unos 4,500 años. Los trabajadores necesitaron unos 20 años y más de 2 millones de bloques de piedra para terminarla, y llegó a medir unos 480 pies. Como era imposible cultivar mientras el Nilo cubría los campos, los historiadores creen que muchos agricultores trabajaron en las construcciones durante la inundación.'}
  ],
  points:[
   {label:'cómo el Nilo hizo posible la agricultura', facts:['El Nilo se desbordaba cada año y dejaba tierra fértil.','Los agricultores sembraban cuando el agua de la inundación se retiraba.','Heródoto llamó a Egipto el «regalo del Nilo».']},
   {label:'por qué los faraones construyeron pirámides', facts:['Los faraones eran los reyes de Egipto.','Las pirámides eran tumbas que ayudaban a un rey a esperar su renacimiento.','Las pirámides más grandes están en Guiza.']},
   {label:'cómo se construyó la Gran Pirámide', facts:['Se construyó para Keops hace unos 4,500 años.','Tomó unos 20 años y más de 2 millones de bloques de piedra.','Los agricultores pudieron trabajar en ella mientras las inundaciones cubrían los campos.']}
  ],
  thesis:'El Nilo hizo posible la civilización del antiguo Egipto al alimentar a los agricultores, inspirar tumbas en forma de pirámide para los faraones y sostener grandes construcciones como la Gran Pirámide.'},
 {id:'hammurabi', group:'El mundo antiguo', name:'El Código de Hammurabi', blurb:'Uno de los primeros conjuntos de leyes escritas',
  keywords:['hammurabi','babilonia','codigo','ley','leyes','estela','mesopotamia'],
  sections:[
   {h:'Un rey y sus leyes', p:'Hammurabi fue un rey de Babilonia, una ciudad poderosa de Mesopotamia, que gobernó hasta cerca del año 1750 a. C. Hacia el final de su reinado, sus decisiones se reunieron en un conjunto de 282 leyes. Las leyes trataban de la familia, la propiedad, el comercio y el trabajo.'},
   {h:'Leyes talladas en piedra', p:'Las leyes se tallaron en escritura cuneiforme sobre un alto pilar de piedra negra, llamado estela, de unos 7 pies de altura. En la parte de arriba, una imagen muestra a Hammurabi frente a Shamash, el dios del sol y de la justicia. Como el pilar se exhibía en público, la gente podía ver cuáles eran las reglas.'},
   {h:'Ojo por ojo', p:'La mayoría de las leyes seguían un patrón de «si… entonces»: si ocurría algo, seguía cierto castigo. Una ley famosa dice que un hombre que le saca un ojo a otro perderá su propio ojo. Esta idea buscaba que el castigo fuera igual al daño. Sin embargo, los castigos podían ser distintos según la clase social de la persona.'}
  ],
  points:[
   {label:'quién fue Hammurabi y qué contenía su código', facts:['Hammurabi fue rey de Babilonia hasta cerca del año 1750 a. C.','Sus decisiones se reunieron en 282 leyes.','Las leyes trataban de la familia, la propiedad, el comercio y el trabajo.']},
   {label:'cómo se registraron y se mostraron las leyes', facts:['Las leyes se tallaron en un pilar de piedra negra de unos 7 pies de alto.','Una imagen muestra a Hammurabi con el dios del sol Shamash.','El pilar se exhibía en público para que la gente viera las reglas.']},
   {label:'cómo funcionaban y castigaban las leyes', facts:['Las leyes seguían un patrón de «si… entonces».','Una ley establecía ojo por ojo como castigo.','Los castigos podían depender de la clase social de la persona.']}
  ],
  thesis:'El Código de Hammurabi muestra cómo un rey antiguo reunió sus leyes, las exhibió en público y usó reglas claras para castigar las faltas.'},
 {id:'athens', group:'El mundo antiguo', name:'La democracia en la antigua Atenas', blurb:'Ciudadanos que se gobiernan solos',
  keywords:['atenas','ateniense','democracia','ciudadano','asamblea','clistenes','griego','grecia','votar','voto'],
  sections:[
   {h:'El nacimiento de la democracia', p:'Hace unos 2,500 años, la ciudad-estado griega de Atenas comenzó un nuevo tipo de gobierno. Alrededor del año 508 a. C., un líder llamado Clístenes reformó las leyes para que los ciudadanos comunes, y no solo las familias poderosas, tuvieran voz. A menudo se le llama el padre de la democracia ateniense. La palabra democracia viene de palabras griegas que significan «pueblo» y «poder».'},
   {h:'Cómo funcionaba', p:'Atenas tenía una democracia directa, lo que significa que los ciudadanos votaban las leyes ellos mismos en lugar de elegir representantes. La Asamblea se reunía unas 40 veces al año, y todo ciudadano varón podía asistir y votar. Un Consejo de 500 ciudadanos, elegidos por sorteo, preparaba los asuntos que la Asamblea iba a discutir. Los ciudadanos también podían votar para enviar al exilio por 10 años a un líder peligroso.'},
   {h:'Quiénes quedaban fuera', p:'La democracia ateniense era limitada. Solo los hombres libres hijos de padres atenienses podían participar. Las mujeres, las personas esclavizadas y los extranjeros que vivían en Atenas no podían votar. Esparta, una ciudad-estado rival, organizó su gobierno en torno al entrenamiento militar y la disciplina.'}
  ],
  points:[
   {label:'cómo empezó la democracia en Atenas', facts:['Clístenes reformó Atenas alrededor del año 508 a. C.','Se le llama el padre de la democracia ateniense.','Democracia viene de palabras griegas que significan pueblo y poder.']},
   {label:'cómo funcionaba la democracia ateniense', facts:['Los ciudadanos votaban las leyes directamente.','La Asamblea se reunía unas 40 veces al año.','Un Consejo de 500 elegidos por sorteo planeaba el trabajo de la Asamblea.']},
   {label:'quiénes quedaban fuera de la democracia ateniense', facts:['Solo los hombres libres hijos de padres atenienses podían votar.','Las mujeres, las personas esclavizadas y los extranjeros quedaban fuera.','Esparta se centraba en el entrenamiento militar.']}
  ],
  thesis:'Atenas creó una democracia temprana al dar poder a los ciudadanos mediante una asamblea y un consejo, pero dejó fuera a mucha gente.'},
 {id:'silkroad', group:'El mundo antiguo', name:'La Ruta de la Seda', blurb:'Una red de rutas comerciales',
  keywords:['seda','ruta','rutas','comercio','china','caravana','han','camino'],
  sections:[
   {h:'Una red, no un solo camino', p:'La Ruta de la Seda no era un solo camino. Era una red de rutas comerciales que unía a China con las tierras alrededor del mar Mediterráneo. El comercio por estas rutas creció durante la dinastía Han de China, hace más de 2,000 años, y todo el sistema se extendía unas 4,000 millas. Pocos comerciantes recorrían todo el trayecto. Las mercancías solían pasar de un comerciante a otro a lo largo de la ruta.'},
   {h:'Mercancías e ideas', p:'La seda era el producto más famoso y viajaba hacia el oeste. La lana, el oro y la plata viajaban hacia el este, y también se comerciaban especias, té y porcelana. Inventos como el papel se movieron por las rutas. Las ideas también viajaron, y el budismo se extendió de la India a China por la Ruta de la Seda.'},
   {h:'Peligros y decadencia', p:'Los viajeros cruzaban desiertos y altas montañas, y las caravanas se detenían en pueblos de oasis para conseguir agua, comida y descanso. Las enfermedades también viajaban por las rutas. Con el tiempo, las rutas marítimas más rápidas hicieron menos importante el comercio por tierra, y en 1453 el Imperio otomano cerró el comercio con Occidente.'}
  ],
  points:[
   {label:'qué fue la Ruta de la Seda', facts:['Era una red de rutas, no un solo camino.','Unía a China con el mundo mediterráneo.','Se extendía unas 4,000 millas.']},
   {label:'qué intercambiaban los comerciantes y viajeros', facts:['La seda viajaba al oeste, mientras la lana, el oro y la plata viajaban al este.','El papel y las especias se movían por las rutas.','El budismo se extendió de la India a China.']},
   {label:'los peligros del viaje y por qué decayeron las rutas', facts:['Los viajeros cruzaban desiertos y altas montañas.','Las enfermedades también se propagaban por las rutas.','Crecieron las rutas marítimas, y en 1453 el Imperio otomano cerró el comercio con Occidente.']}
  ],
  thesis:'La Ruta de la Seda fue importante porque conectó tierras lejanas, llevó mercancías e ideas y enfrentó peligros y cambios que al final acabaron con el comercio por tierra.'},
 {id:'pottery', group:'El mundo antiguo', name:'La cerámica más antigua del mundo', blurb:'Ollas de barro de la era de hielo',
  keywords:['ceramica','olla','barro','cueva','xianrendong','china','cocinar','cocina'],
  sections:[
   {h:'Una sorpresa en una cueva', p:'En la cueva Xianrendong, en la provincia de Jiangxi, China, los científicos encontraron pedazos rotos de ollas de barro de unos 20,000 años de antigüedad. Son la cerámica más antigua que se conoce. El hallazgo se dio a conocer en 2012. Durante años, muchos expertos habían creído que la cerámica comenzó solo después de que la gente empezó a cultivar, hace unos 10,000 años.'},
   {h:'Cocineros de la era de hielo', p:'Las personas que hicieron estas ollas eran cazadores-recolectores que se movían de un lugar a otro durante la última era de hielo. Muchos pedazos tienen marcas de quemado, lo cual sugiere que las ollas se ponían sobre el fuego para cocinar. Cocinar en ollas de barro podía ayudar a la gente a obtener más energía de alimentos con almidón y de la carne cuando era difícil encontrar comida.'},
   {h:'Una historia que cambia', p:'El descubrimiento mostró que la cerámica se inventó al menos 10,000 años antes de que empezara la agricultura en esa parte del mundo. También mostró que la gente cocinaba en ollas de barro mucho antes de que existieran campos o ciudades. La datación por radiocarbono de huesos y carbón encontrados junto a la cerámica ayudó a los científicos a saber la edad de los pedazos.'}
  ],
  points:[
   {label:'qué encontraron los científicos en la cueva', facts:['Los pedazos de cerámica tienen unos 20,000 años.','Vienen de la cueva Xianrendong, en la provincia de Jiangxi, China.','Son la cerámica más antigua que se conoce.']},
   {label:'cómo se usaron las primeras ollas', facts:['Las ollas las hicieron personas que cazaban y recolectaban comida.','Las marcas de quemado sugieren que se usaban para cocinar.','Cocinar ayudó a la gente a obtener más energía de los alimentos.']},

 {id:'monarch', group:'Animales y naturaleza', name:'La migración de la mariposa monarca', blurb:'Un viaje de miles de millas',
  keywords:['monarca','mariposa','migracion','migrar','algodoncillo','mexico'],
  sections:[
   {h:'Un largo viaje hacia el sur', p:'Las mariposas monarca no pueden sobrevivir a los inviernos fríos del norte, así que cada otoño viajan hacia el sur. Las monarcas que viven al este de las Montañas Rocosas vuelan hasta unas 3,000 millas a los bosques del centro de México, mientras que las monarcas del oeste suelen pasar el invierno en la costa de California. Usan las corrientes de aire para planear durante el viaje.'},
   {h:'Generaciones en movimiento', p:'Las monarcas que vuelan hacia el sur son distintas de las de verano. Una monarca de verano vive solo unas semanas, pero la generación migratoria puede vivir hasta 9 meses. En primavera, estas monarcas vuelan al norte y ponen huevos, y se necesitan varias generaciones nuevas para volver a extenderse por América del Norte. Lo sorprendente es que las mariposas que llegan a México nunca habían estado allí.'},
   {h:'Algodoncillo y peligros', p:'Las orugas de la monarca comen solo algodoncillo, y las hembras ponen sus huevos solo en plantas de algodoncillo. En muchos lugares, el algodoncillo se ha perdido por las granjas, los caminos y los edificios. El número de monarcas también ha bajado por los pesticidas y el cambio climático. La gente puede ayudar sembrando algodoncillo y flores que den néctar.'}
  ],
  points:[
   {label:'adónde viajan las monarcas cada año', facts:['Las monarcas del este vuelan hasta unas 3,000 millas a México.','Las monarcas del oeste pasan el invierno en la costa de California.','Planean sobre las corrientes de aire.']},
   {label:'cómo las generaciones continúan la migración', facts:['Las monarcas de verano viven unas semanas, pero la generación migratoria vive hasta 9 meses.','Se necesitan varias generaciones para extenderse de nuevo hacia el norte.','Las mariposas que llegan a México nunca habían estado allí.']},
   {label:'por qué las monarcas necesitan algodoncillo y ayuda', facts:['Las orugas comen solo algodoncillo.','El algodoncillo se ha perdido por las granjas, los caminos y los edificios.','Sembrar algodoncillo y flores puede ayudar.']}
